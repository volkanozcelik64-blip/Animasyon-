<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nod ve Sayılar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans:wght@500;800&display=swap">
<style>
/* Layout: siyah sahne (canvas) üstte, altında küçük kumanda paneli. "Animator vs Math" gibi tek, koyu görünüm bilinçli seçim. */
:root{
  --bg:#08080a;
  --panel:#141418;
  --line:#2c2c34;
  --fg:#f2f2f2;
  --muted:#9a9aa8;
  --accent:#e04b4b;
  --on-accent:#ffffff;
  --font-ui:"Fredoka","Arial Rounded MT Bold",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);padding-inline:16px;padding-block:16px 28px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.stage-wrap{width:min(100%,calc(80vh*16/9));margin:0 auto;max-width:100%}
.stage-wrap.vertical{width:min(100%,calc(80vh*9/16))}
canvas{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:var(--bg);cursor:pointer;max-width:100%}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
button{font-family:var(--font-ui);font-size:1rem;font-weight:600;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--fg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hint{color:var(--muted);font-size:.9rem;text-align:center;margin:0}
</style>
</head>
<body>
<div class="app">
  <div class="stage-wrap" id="wrap"><canvas id="stage" aria-label="Nod ve Sayılar animasyonu"></canvas></div>
  <div class="controls">
    <button id="btnPlay" class="primary">▶ Oynat</button>
    <button id="btnPause">⏸ Duraklat</button>
    <button id="btnMusic">🎵 Müzik: Açık</button>
  </div>
  <p class="hint">Nod, büyüyen bir denklemin içinde dört işlemle boğuşuyor. Boşluk tuşu: duraklat/devam.</p>
</div>
<script>
"use strict";
const QS = new URLSearchParams(location.search);
const RENDER = QS.has('render');
let vertical = QS.get('v') === '1';
const R = 1.5;
let W = 1280, H = 720, U = 1;
const G = 0;                                   // denklemin taban çizgisi = zemin
let time = 0, vclock = 0, paused = false, started = false, running = false;
const F = (sz, w = 700) => `${w} ${Math.round(sz)}px Fredoka, "Arial Rounded MT Bold", Arial, sans-serif`;
const EQF = sz => `500 ${Math.round(sz)}px "Noto Sans", "DejaVu Sans", Arial, sans-serif`;
const PAL = ['#ff5d73', '#ffa62b', '#2ec4b6', '#4cc9f0', '#9b5de5', '#f15bb5', '#00bb7f', '#ff8c42'];
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const INK = '#1d1f3b', SHADE = '#c9cce6', SCARF = '#e04b4b';
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');

/* ---------- renk yardımcıları ---------- */
const _rgb = {};
function hexRgb(h) { if (_rgb[h]) return _rgb[h]; const n = parseInt(h.slice(1), 16); return _rgb[h] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(h, c, t) { const a = hexRgb(h); return `rgb(${a.map((v, i) => Math.round(v + (c[i] - v) * t)).join(',')})`; }
const lighten = (h, t) => mix(h, [255, 255, 255], t), darken = (h, t) => mix(h, [0, 0, 0], t);
const colorFor = v => PAL[Math.abs(Math.round(v)) % PAL.length];

/* ---------- easing ---------- */
const E = {
  lin: t => t,
  io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI) / 3) + 1,
};

/* ---------- zaman çizelgesi: tüm hareketler bu iş kuyruğundan geçer ---------- */
const jobs = [];
function anim(dur, fn, ease = E.lin) { return new Promise(res => jobs.push({ t: 0, dur: Math.max(1, dur), fn, ease, res })); }
function tween(o, to, dur, ease = E.io) { const from = {}; for (const k in to) from[k] = o[k]; return anim(dur, t => { for (const k in to) o[k] = from[k] + (to[k] - from[k]) * t; }, ease); }
const wait = ms => anim(ms, () => { });
function runJobs(dt) {
  for (let i = 0; i < jobs.length; i++) {
    const j = jobs[i]; j.t += dt; const p = Math.min(1, j.t / j.dur); j.fn(j.ease(p));
    if (p >= 1) { jobs.splice(i, 1); i--; j.res(); }
  }
}



/* ================== Ses: canlı çalınır ya da video için kaydedilip sonradan işlenir ================== */
let AC = null, master = null, musicGain = null, noiseBuf = null, musicOn = true, OFF = false, T0 = 0;
const events = [];
function setupAudio(c) {
  AC = c; master = AC.createGain(); master.gain.value = .55; master.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = .12; musicGain.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function initAudio() {
  if (RENDER) return;
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { setupAudio(new (window.AudioContext || window.webkitAudioContext)()); } catch (e) { AC = null; }
}
const now = () => OFF ? T0 : AC.currentTime;
function tone(f, d, { type = 'sine', vol = .3, to = null, delay = 0, dest = null } = {}) {
  if (!AC) return; const t0 = now() + Math.max(0, delay);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0 + d + .05);
}
function noise(d, { vol = .3, f = 1000, to = null, q = 1, type = 'bandpass', delay = 0, dest = null } = {}) {
  if (!AC) return; const t0 = now() + Math.max(0, delay);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t0);
  if (to) fl.frequency.exponentialRampToValueAtTime(to, t0 + d);
  const g = AC.createGain(); g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  s.connect(fl); fl.connect(g); g.connect(dest || master); s.start(t0); s.stop(t0 + d + .05);
}
const semi = (b, s) => b * Math.pow(2, s / 12);
const SFX = {
  pop: (p = 1) => tone(420 * p, .14, { to: 900 * p, vol: .25 }),
  tick: () => tone(1100, .05, { type: 'square', vol: .06 }),
  go: () => { tone(660, .12, { type: 'triangle', vol: .2 }); tone(990, .3, { type: 'triangle', vol: .2, delay: .1 }); },
  swoosh: () => noise(.22, { vol: .55, f: 500, to: 5000, q: .8 }),
  boom: () => { tone(150, .6, { vol: .7, to: 40 }); noise(.45, { vol: .35, f: 500, to: 80, type: 'lowpass' }); },
  clang: () => { tone(1760, .6, { type: 'triangle', vol: .12, to: 1700 }); tone(2637, .4, { vol: .07 }); },
  zap: () => { tone(1300, .25, { type: 'sawtooth', vol: .07, to: 200 }); noise(.2, { vol: .2, f: 3000 }); },
  magic: () => [0, 4, 7, 12, 16].forEach((s, i) => tone(semi(523, s), .25, { type: 'triangle', vol: .12, delay: i * .06 })),
  whistle: () => tone(1400, .9, { vol: .1, to: 300 }),
  shrink: () => tone(600, .7, { type: 'square', vol: .045, to: 180 }),
  hum: () => tone(90, 1.1, { type: 'sawtooth', vol: .05, to: 150 }),
  win: () => [0, 4, 7, 12].forEach((s, i) => tone(semi(523, s), .4, { type: 'triangle', vol: .16, delay: i * .08 })),
  land: () => noise(.12, { vol: .3, f: 220, type: 'lowpass' }),
  ding: (p = 1) => { tone(880 * p, .3, { type: 'triangle', vol: .14 }); tone(1320 * p, .35, { type: 'sine', vol: .08, delay: .05 }); },
  roll: () => noise(1.6, { vol: .12, f: 300, to: 120, type: 'lowpass' }),
};
const sfx = {};
for (const k in SFX) sfx[k] = (...a) => { if (RENDER) events.push({ t: vclock / 1000, k, a }); else SFX[k](...a); };
const BPM = 104, ROOTS = [57, 53, 55, 52];
const mhz = m => 440 * Math.pow(2, (m - 69) / 12);
function musicStep(step, t) {
  const delay = t - now(), i = step % 8, r = ROOTS[Math.floor(step / 8) % 4];
  if (i % 4 === 0) tone(110, .18, { vol: .45, to: 40, delay, dest: musicGain });
  if (i % 2 === 1) noise(.04, { vol: .1, f: 8000, type: 'highpass', delay, dest: musicGain });
  if (i === 0 || i === 3 || i === 6) tone(mhz(r - 12), .22, { type: 'triangle', vol: .32, delay, dest: musicGain });
  if (i % 2 === 0) tone(mhz(r + [0, 3, 7, 10][(step / 2) % 4 | 0] + 12), .16, { type: 'square', vol: .045, delay, dest: musicGain });
}
let nextNoteT = 0, mstep = 0;
setInterval(() => {
  if (RENDER || !AC || !musicOn || paused || !running) { if (AC && !RENDER) nextNoteT = AC.currentTime + .05; return; }
  const spb = 60 / BPM / 2;
  if (nextNoteT < AC.currentTime) nextNoteT = AC.currentTime + .05;
  while (nextNoteT < AC.currentTime + .2) { musicStep(mstep++, nextNoteT); nextNoteT += spb; }
}, 50);

/* ================== Sahne durumu ================== */
let S, hero;
function makeHero() { return { arm2: .35, wink: 0, mouth: 0, ts: 1, ride: false, dustT: 0, x: -900, hop: 0, dir: 1, armA: .5, tool: null, walk: 0, phase: 0, s: .5, rot: 0, sqx: 1, sqy: 1, lastX: -900, bubble: null, ghosts: [], dash: false, glint: 0, brow: 0, happy: 0 }; }
function resetScene() {
  jobs.length = 0;
  S = { toks: [], pieces: [], texts: [], parts: [], slashes: [], bolts: [], rings: [], mstars: [], rays: [], field: null, shake: 0, flash: 0, flashColor: '#fff',
    cam: { x: 0, y: -80, z: 1 }, hitstop: 0, slow: 1, invert: 0, lines: null, follow: null, rideOn: null, shadow: null, cut: null, card: null };
  hero = makeHero();
}

/* ---------- metin, parçacık, efektler ---------- */
function addText(o) { const t = Object.assign({ x: 0, y: 0, size: 60, color: '#fff', stroke: '#1b1446', s: 1, alpha: 1, rot: 0, text: '' }, o); S.texts.push(t); return t; }
function removeText(t) { S.texts = S.texts.filter(x => x !== t); }
function popWord(text, x, y, o = {}) {
  const t = addText({ text, x, y, size: (o.size || 64) * U, color: o.color || '#ffcf3f', stroke: o.stroke || '#2a1458', s: 0, rot: o.rot ?? rand(-.12, .12), burst: o.burst || null });
  (async () => { await tween(t, { s: 1 }, 260, E.back); await wait(o.hold ?? 750); await tween(t, { alpha: 0, y: t.y - 40 * U, s: 1.15 }, 300); removeText(t); })();
  return t;
}
function burst(x, y, n, o = {}) {
  const cols = o.colors || ['#fff', '#ffcf3f', SCARF, '#4cc9f0'];
  for (let i = 0; i < n; i++) {
    const a = o.dir !== undefined ? o.dir + (Math.random() - .5) * (o.spread || 1) : Math.random() * Math.PI * 2;
    const sp = (o.speed || .5) * (.4 + Math.random());
    S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), g: o.g ?? .0012, life: (o.life || 800) * rand(.6, 1.2), age: 0,
      size: (o.size || 6) * rand(.6, 1.4) * U, color: cols[i % cols.length], shape: o.shape || 'circle', rot: rand(0, 6), vr: rand(-.02, .02), bounce: !!o.bounce });
  }
}
function confetti() { for (let i = 0; i < 5; i++) burst(W * rand(.1, .9), -10, 26, { dir: Math.PI / 2, spread: 1.4, speed: .35, shape: 'rect', life: 2600, g: .00035, colors: PAL, size: 7 }); }
function slash(x1, y1, x2, y2, o = {}) { S.slashes.push({ x1, y1, x2, y2, age: 0, life: o.life || 450, w: (o.w || 10) * U, color: o.color || '#3a7bd5' }); }
function bolt(x1, y1, x2, y2) {
  const pts = [], n = 10; for (let i = 0; i <= n; i++) { const t = i / n, j = (i === 0 || i === n) ? 0 : rand(-18, 18) * U; pts.push({ x: x1 + (x2 - x1) * t - (y2 - y1) / Math.hypot(x2 - x1, y2 - y1) * j, y: y1 + (y2 - y1) * t + (x2 - x1) / Math.hypot(x2 - x1, y2 - y1) * j }); }
  S.bolts.push({ pts, age: 0, life: 350 });
}
function ring(x, y, max = 220, color = '#fff') { S.rings.push({ x, y, age: 0, life: 520, max: max * U, color }); }
function impact(x, y, o = {}) {
  sfx.boom(); S.shake = (o.shake || 16) * U; S.flash = o.flash ?? .55; S.flashColor = o.flashColor || '#fff';
  ring(x, y, o.ring || 240, o.ringColor || '#fff');
  burst(x, y, 36, { speed: .7, shape: 'star', colors: o.colors });
}
function camTo(x, y, z, dur = 400, ease = E.io) { return tween(S.cam, { x, y, z }, dur, ease); }
function camReset(dur = 500) { return camTo(W / 2, H / 2, 1, dur); }
function camPunch(x, y, z = 1.2) { camTo(x, y, z, 90, E.out).then(() => camReset(650)); }
function applyCam(par = 1) {
  const c = S.cam, z = 1 + (c.z - 1) * par;
  const cx = clamp(W / 2 + (c.x - W / 2) * par, W / (2 * z), W - W / (2 * z)), cy = clamp(H / 2 + (c.y - H / 2) * par, H / (2 * z), H - H / (2 * z));
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-cx, -cy);
}
function puff(x, y, n = 6, dir = 0) {
  for (let i = 0; i < n; i++) S.parts.push({ x: x + rand(-10, 10) * U, y: y - rand(0, 8) * U, vx: (dir || (Math.random() - .5) * 2) * rand(.05, .2), vy: -rand(.01, .06), g: -.00003, life: rand(450, 700), age: 0,
    size: rand(6, 12) * U, color: 'rgba(225,225,240,.22)', shape: 'puff', rot: 0, vr: 0, bounce: false });
}
function raysAt(x, y, color = '#ffd84d', hold = 1400, size = 260) {
  const r = { x, y, a: 0, color, size: size * U };
  S.rays.push(r);
  tween(r, { a: 1 }, 300).then(() => wait(hold)).then(() => tween(r, { a: 0 }, 500)).then(() => { S.rays = S.rays.filter(q => q !== r); });
  return r;
}
function speedLines(dur = 600) { S.lines = { a: 1 }; const l = S.lines; wait(dur).then(() => tween(l, { a: 0 }, 300)).then(() => { if (S.lines === l) S.lines = null; }); }
function hitStop(ms = 100, inv = 0) { S.hitstop = ms; S.invert = inv; }
function firework(x, y) {
  const c = PAL[Math.floor(Math.random() * PAL.length)];
  burst(x, y, 46, { colors: [c, '#fff', lighten(c, .4)], speed: .42, g: .00025, life: 1500, size: 4 });
  burst(x, y, 12, { colors: ['#fff'], speed: .2, shape: 'star', life: 900, g: 0 });
  ring(x, y, 150, c); noise(.3, { vol: .25, f: 2500, to: 600 }); tone(200, .25, { vol: .2, to: 60 });
}

function heroRunTo(x, dur, faceRight = false) {
  const h = hero;
  if (Math.abs(x - h.x) < 2) { if (faceRight) h.dir = 1; return Promise.resolve(); }
  h.dir = x > h.x ? 1 : -1;
  const d = dur ?? clamp(Math.abs(x - h.x) * 1.4, 250, 1000);
  return tween(h, { x }, d, E.io).then(() => { if (faceRight) h.dir = 1; });
}
function heroJumpTo(x, endHop, dur, height = 100) {
  const h = hero, x0 = h.x, h0 = h.hop;
  if (Math.abs(x - x0) > 2) h.dir = x > x0 ? 1 : -1;
  return anim(dur, t => { h.x = x0 + (x - x0) * t; h.hop = h0 + (endHop - h0) * t + Math.sin(Math.PI * t) * height * U; }, E.io)
    .then(() => { if (endHop === 0) { h.hop = 0; h.sqy = .82; h.sqx = 1.12; sfx.land(); puff(h.x - 20 * U, G, 4, -1); puff(h.x + 20 * U, G, 4, 1); tween(h, { sqy: 1, sqx: 1 }, 320, E.back); } });
}
const SHX = 26, SHY = 168, ARM = 78, TOOLS = 1.2;
function heroHand(ext = 0) {
  const h = hero, k = U * h.s, sx = h.x + h.dir * SHX * k, sy = G - h.hop - SHY * k, L = (ARM + ext * TOOLS) * k;
  return { x: sx + h.dir * Math.sin(h.armA) * L, y: sy + Math.cos(h.armA) * L };
}
function say(text, ms = 1400) {
  const b = { text, a: 0 }; hero.bubble = b;
  tween(b, { a: 1 }, 180).then(() => wait(ms)).then(() => hero.bubble === b ? tween(b, { a: 0 }, 250) : null).then(() => { if (hero.bubble === b) hero.bubble = null; });
}
async function equip(tool) {
  if (hero.tool === tool) return;
  const hp = heroHand(30);
  burst(hp.x, hp.y, 16, { colors: ['#fff', '#ffcf3f'], speed: .3, shape: 'star' });
  sfx.pop(1.3); hero.tool = tool; hero.sqy = 1.15; tween(hero, { sqy: 1 }, 300, E.back);
  await wait(250);
}
async function heroCheer() { tween(hero, { armA: 3, arm2: 2.9 }, 200, E.out); hero.happy = 1; await heroJumpTo(hero.x, 0, 520, 90); tween(hero, { armA: .5, arm2: .35 }, 300); hero.happy = 0; }
function wave(ms = 1400, a0 = 2.8) { return anim(ms, t => hero.armA = a0 + Math.sin(t * Math.PI * 6) * .28).then(() => tween(hero, { armA: .5 }, 300)); }


function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function circle(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }
function starPath(x, y, R1, r1, rot = 0, n = 5) { ctx.beginPath(); for (let i = 0; i < n * 2; i++) { const q = i % 2 ? r1 : R1, a = rot + i * Math.PI / n - Math.PI / 2; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); }
function tube(p0, p1, p2, w, ol) {
  const path = () => { ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.quadraticCurveTo(p1[0], p1[1], p2[0], p2[1]); };
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  path(); ctx.strokeStyle = ol; ctx.lineWidth = w + 9; ctx.stroke();
  path(); ctx.strokeStyle = '#fff'; ctx.lineWidth = w; ctx.stroke();
  ctx.save(); ctx.translate(w * .2, 0); path(); ctx.strokeStyle = SHADE; ctx.lineWidth = w * .26; ctx.stroke(); ctx.restore();
}
function arm(sx, sy, a, side, w, ol) {
  const hx = sx + side * Math.sin(a) * ARM, hy = sy + Math.cos(a) * ARM;
  const ex = (sx + hx) / 2 + side * Math.cos(a) * 12, ey = (sy + hy) / 2 - Math.sin(a) * 12;
  tube([sx, sy], [ex, ey], [hx, hy], w, ol);
  return [hx, hy];
}
function drawTool(t, h) {
  if (!t) return;
  if (t === 'sword') {
    ctx.fillStyle = '#6b3d1f'; rr(-4, -18, 8, 22, 3); ctx.fill();
    ctx.fillStyle = '#ffcf3f'; rr(-15, 4, 30, 8, 3); ctx.fill();
    const g = ctx.createLinearGradient(-7, 0, 7, 0); g.addColorStop(0, '#cfd8ff'); g.addColorStop(.5, '#ffffff'); g.addColorStop(1, '#8e9bd6');
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-6, 12); ctx.lineTo(-6, 104); ctx.lineTo(0, 122); ctx.lineTo(6, 104); ctx.lineTo(6, 12); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#5a66a8'; ctx.lineWidth = 2; ctx.stroke();
    if (h && h.glint > 0) { ctx.fillStyle = '#fff'; ctx.shadowColor = '#bff6ff'; ctx.shadowBlur = 20; starPath(0, 110, 30 * h.glint, 6 * h.glint, time * .01, 4); ctx.fill(); ctx.shadowBlur = 0; }
  } else if (t === 'hammer') {
    ctx.fillStyle = '#8a5a2b'; rr(-4, -12, 8, 80, 3); ctx.fill();
    ctx.fillStyle = '#7d8597'; rr(-32, 60, 64, 42, 8); ctx.fill();
    ctx.fillStyle = '#aab3c5'; rr(-28, 64, 56, 9, 4); ctx.fill();
    ctx.fillStyle = '#4f5568'; rr(-32, 60, 9, 42, 4); ctx.fill(); rr(23, 60, 9, 42, 4); ctx.fill();
  } else if (t === 'wand') {
    ctx.fillStyle = '#3b1f5e'; rr(-3.5, -8, 7, 62, 3); ctx.fill();

    burst(slotX[i], G - FS * .36, 12, { speed: .35, colors: ['#fff', '#9fd8ff'] }); sfx.pop(1 + i * .15);
    tween(f4, { s: 1 }, 300, E.back); fours.push(f4); await wait(160);
  }
  hero.brow = 0;
  await wait(1000);
  fours.forEach(f4 => f4.tag = null);
  const n12 = tok('12', 0, { alpha: 0 }), eq7 = tok('=', 0, { s: 0 });
  eq = [n12, dv, th, eq7, fours[0]];
  const mid7 = T12.x + 40;
  const c8 = centers(eq, { mid: mid7 }); n12.x = c8[0];
  [fours[1], fours[2]].forEach(f4 => { burst(f4.x, G - FS * .36, 12, { shape: 'star', speed: .3, colors: ['#fff', '#ffe066'] }); tween(f4, { s: 0 }, 250, E.in).then(() => untok(f4)); });
  tween(n12, { alpha: 1 }, 400);
  await relayout(eq, { mid: mid7 }, 550);
  sfx.win(); await tween(eq7, { s: 1 }, 300, E.back);
  fours[0].glow = 1; tween(fours[0], { glow: 0 }, 1200);
  camFit(500, Z * .95);
  heroRunTo(fours[0].x + 140, 600).then(() => hero.dir = -1);
  await wait(1400);

  let cur = fours[0];
  [n12, dv, th, eq7].forEach((t, i) => fallAway(t, i * 70));
  await Promise.all([tween(cur, { x: mid7 }, 500), camTo(mid7 + 60, CY, Z * 1.05, 500)]);
  await heroRunTo(mid7 - 150, 450, true);
  for (const [dTxt, out] of [['2', '2'], ['2', '1']]) {
    const d1 = tok('÷', 0, { y: -700 }), d2 = tok(dTxt, 0, { y: -700 });
    const cm = centers([cur, d1, d2], { anchor: 0, x: cur.x }); d1.x = cm[1]; d2.x = cm[2];
    dropTok(d1, 300); await wait(120); await dropTok(d2, 280);
    await tween(hero, { armA: 3.1 }, 220, E.out); hero.glint = 1;
    await wait(200);
    sfx.swoosh();
    const cyy = G - FS * .36;
    tween(hero, { armA: .6 }, 110, E.in);
    slash(cur.x + 10, cyy - 90, cur.x - 10, cyy + 90, { life: 700, w: 8, color: '#9fd8ff' });
    hitStop(80);
    await wait(150);
    untok(cur);
    const halves = [-1, 1].map(s => tok(out, cur.x, { s: .8 }));
    halves.forEach((t, i) => { tween(t, { x: cur.x + (i ? 70 : -70), s: 1 }, 350, E.out); });
    sfx.pop(1.2); burst(cur.x, cyy, 12, { speed: .4, colors: ['#fff', '#9fd8ff'] });
    [d1, d2].forEach(t => tween(t, { s: 0 }, 250).then(() => untok(t)));
    await wait(500);
    halves[1].alpha = 1; tween(halves[1], { s: 0 }, 250).then(() => untok(halves[1]));
    cur = halves[0];
    await tween(cur, { x: mid7 }, 300);
    tween(hero, { armA: .5 }, 200);
    await wait(300);
  }

  /* ---- 8) Son: tek bir 1 kalır... ---- */
  const ONE = cur;
  camTo(ONE.x - 40, CY - 10, Z * 1.25, 700);
  await heroRunTo(ONE.x - 75, 500, true);
  const hp0 = heroHand(30); burst(hp0.x, hp0.y, 10, { shape: 'star', speed: .25, colors: ['#fff', '#ffcf3f'] }); hero.tool = null;
  await tween(hero, { armA: 1.35 }, 220);
  ONE.follow = true; tween(ONE, { s: .55 }, 250); sfx.pop(1.4);
  await tween(hero, { armA: 2.5 }, 300);
  await wait(400);
  hero.wink = 1; hero.mouth = 1; say('Bir daha?', 1200); await wait(1400); hero.wink = 0; hero.mouth = 0;
  ONE.follow = false; sfx.swoosh();
  const oy = ONE.y;
  tween(hero, { armA: 3.0 }, 150);
  await anim(650, k => { ONE.y = oy - 900 * k; ONE.rot = k * 8; }, E.out);
  untok(ONE);
  S.cut = { a: 0, txt: '1 + 1 = ?' }; sfx.boom();
  await tween(S.cut, { a: 1 }, 150);
  await wait(1400);
  // kapanış kartı
  S.toks = []; S.pieces = [];
  hero.x = hero.lastX = 0; hero.hop = 0; hero.armA = .5; hero.dir = 1; hero.tool = null;
  Object.assign(S.cam, { x: 0, y: vertical ? -180 : -120, z: vertical ? 1.6 : 1.7 });
  S.cut = null;
  S.card = { s: 0 }; tween(S.card, { s: 1 }, 500, E.back); sfx.win();
  hero.wink = 1; hero.mouth = 1; say('Abone olmayı unutma!', 2600); await wave(2600, 2.4);
  hero.wink = 0; hero.mouth = 0;
  await wait(900);
}

/* ================== Oynatma & video çıktısı ================== */
function layout() {
  W = vertical ? 720 : 1280; H = vertical ? 1280 : 720;
  cv.width = W * R; cv.height = H * R;
  document.getElementById('wrap').classList.toggle('vertical', vertical);
}
let runToken = 0;
async function start() {
  initAudio();
  runToken++; const my = runToken;
  resetScene(); started = true; running = true; paused = false;
  await story();
  if (my === runToken) running = false;
}
function togglePause() { if (!started) return; paused = !paused; if (AC) paused ? AC.suspend() : AC.resume(); document.getElementById('btnPause').textContent = paused ? '▶ Devam' : '⏸ Duraklat'; }
document.getElementById('btnPlay').onclick = () => { document.getElementById('btnPlay').textContent = '↺ Baştan'; start(); };
document.getElementById('btnPause').onclick = togglePause;
document.getElementById('btnMusic').onclick = e => { musicOn = !musicOn; e.target.textContent = musicOn ? '🎵 Müzik: Açık' : '🎵 Müzik: Kapalı'; };
cv.addEventListener('click', () => { if (!started) { document.getElementById('btnPlay').textContent = '↺ Baştan'; start(); } else togglePause(); });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); togglePause(); } });

/* video üretimi (headless tarayıcıdan çağrılır) */
window.R_init = async () => { await Promise.all([document.fonts.load(EQF(80)), document.fonts.load(F(40))]).catch(() => { }); return true; };
window.R_start = () => { started = true; running = true; resetScene(); story().then(() => { window.R_done = true; }); };
window.R_step = () => { stepFrame(1000 / 30); draw(); return cv.toDataURL('image/jpeg', .92); };
window.R_audio = async () => {
  const sr = 44100, dur = vclock / 1000 + .5;
  const oc = new OfflineAudioContext(2, Math.ceil(dur * sr), sr); OFF = true; setupAudio(oc);
  for (const e of events) { T0 = e.t; SFX[e.k](...e.a); }
  if (musicOn) { T0 = 0; const spb = 60 / BPM / 2; for (let st = 0, t = .05; t < dur - 1.2; st++, t += spb) musicStep(st, t); }
  const buf = await oc.startRendering();
  const n = buf.length, dv = new DataView(new ArrayBuffer(44 + n * 4));
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, n * 4, true);
  const L = buf.getChannelData(0), Rc = buf.getChannelData(1); let o = 44;
  for (let i = 0; i < n; i++) { dv.setInt16(o, clamp(L[i], -1, 1) * 32767, true); dv.setInt16(o + 2, clamp(Rc[i], -1, 1) * 32767, true); o += 4; }
  const u8 = new Uint8Array(dv.buffer); let bin = '';
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
};

layout(); resetScene();
if (!RENDER) {
  hero.x = hero.lastX = 0; Object.assign(S.cam, { x: 0, y: -90, z: vertical ? 1.3 : 1.6 });
  let lastT = performance.now();
  const loop = t => { const real = Math.min(50, t - lastT); lastT = t; if (started && !paused) stepFrame(real); draw(); requestAnimationFrame(loop); };
  (document.fonts ? document.fonts.load(EQF(80)).catch(() => { }) : Promise.resolve()).finally(() => requestAnimationFrame(t => { lastT = t; loop(t); }));
}
</script>
