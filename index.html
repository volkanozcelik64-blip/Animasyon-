<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nod ile Matematik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: defter kağıdı sahnesi (canvas) üstte, altında kumanda paneli. Tek, açık "kağıt" görünüm bilinçli seçim. */
:root{
  --bg:#e8e2d3;
  --panel:#fbf8f0;
  --line:#cfc7b2;
  --fg:#1d1f3b;
  --muted:#6b6f93;
  --accent:#e04b4b;
  --on-accent:#ffffff;
  --danger:#c62f3a;
  --ok:#1f8a57;
  --font-display:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-display);
  padding-inline:16px;padding-block:16px 32px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
h1{margin:0;font-size:clamp(1.3rem,3vw,1.9rem);font-weight:700;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--accent)}
header p{margin:0;color:var(--muted);font-size:.95rem}
.stage-wrap{width:min(100%,calc(78vh*16/9));margin:0 auto;max-width:100%}
.stage-wrap.vertical{width:min(100%,calc(78vh*9/16))}
canvas{display:block;width:100%;height:auto;border-radius:18px;border:2px solid var(--line);
  background:var(--panel);cursor:pointer;max-width:100%}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
  background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.group{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select,input{font-family:var(--font-display);font-size:1rem;color:var(--fg);
  background:var(--panel);border:2px solid var(--fg);border-radius:10px;padding:8px 14px}
button{cursor:pointer;font-weight:600}
button:hover{border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
button.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button.rec.on{background:var(--danger);border-color:var(--danger);color:var(--on-accent)}
input{width:11ch;text-align:center}
.sep{width:1px;align-self:stretch;background:var(--line)}
#msg{min-height:1.3em;text-align:center;color:var(--danger);font-size:.95rem;margin:0}
#msg.ok{color:var(--ok)}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin:0}
@media (max-width:640px){.sep{display:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Nod ile <span>Matematik</span></h1>
    <p>Nod toplamayı mıknatısla, çıkarmayı çekiçle, çarpmayı sihirle, bölmeyi kılıçla çözer.</p>
  </header>

  <div class="stage-wrap" id="wrap"><canvas id="stage" aria-label="Nod ile Matematik animasyonu"></canvas></div>

  <div class="controls">
    <div class="group">
      <button id="btnStart" class="primary">▶ Başlat</button>
      <button id="btnPause">⏸ Duraklat</button>
      <label for="speed" class="hint">Hız</label>
      <select id="speed">
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button id="btnOrient">📱 Dikey (9:16)</button>
      <button id="btnMusic">🎵 Müzik: Açık</button>
      <button id="btnRec" class="rec">⏺ Video Kaydet</button>
    </div>
    <div class="sep"></div>
    <form class="group" id="customForm">
      <label for="custom" class="hint">Kendi sorun:</label>
      <input id="custom" placeholder="örn. 24 ÷ 4" autocomplete="off">
      <button type="submit">Çöz!</button>
    </form>
  </div>
  <p id="msg" role="status"></p>
  <p class="hint">Boşluk tuşu: duraklat/devam. Video kaydı tüm gösteriyi baştan oynatır ve bitince .webm dosyası indirir.</p>
</div>

<script>
"use strict";
/* ================== Temel ayarlar ================== */
const R = 1.5;                       // çizim çözünürlüğü çarpanı (video için net görüntü)
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d');
let W = 1280, H = 720, U = 1, G = 600, CX = 640, D = 240, HOME = 140, vertical = false;
let time = 0, speed = 1, paused = false, started = false, running = false, runToken = 0;
const F = (sz, w = 700) => `${w} ${Math.round(sz)}px Fredoka, "Arial Rounded MT Bold", Arial, sans-serif`;
const PAL = ['#ff5d73', '#ffa62b', '#2ec4b6', '#4cc9f0', '#9b5de5', '#f15bb5', '#00bb7f', '#ff8c42'];
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- renk yardımcıları ---------- */
const _rgb = {};
function hexRgb(h) { if (_rgb[h]) return _rgb[h]; const n = parseInt(h.slice(1), 16); return _rgb[h] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(h, c, t) { const a = hexRgb(h); return `rgb(${a.map((v, i) => Math.round(v + (c[i] - v) * t)).join(',')})`; }
const lighten = (h, t) => mix(h, [255, 255, 255], t), darken = (h, t) => mix(h, [0, 0, 0], t);
const colorFor = v => PAL[Math.abs(Math.round(v)) % PAL.length];

/* ---------- easing ---------- */
const E = {
  lin: t => t,
  io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI) / 3) + 1,
};

/* ---------- zaman çizelgesi: tüm hareketler bu iş kuyruğundan geçer ---------- */
const jobs = [];
function anim(dur, fn, ease = E.lin) { return new Promise(res => jobs.push({ t: 0, dur: Math.max(1, dur), fn, ease, res })); }
function tween(o, to, dur, ease = E.io) { const from = {}; for (const k in to) from[k] = o[k]; return anim(dur, t => { for (const k in to) o[k] = from[k] + (to[k] - from[k]) * t; }, ease); }
const wait = ms => anim(ms, () => { });
function runJobs(dt) {
  for (let i = 0; i < jobs.length; i++) {
    const j = jobs[i]; j.t += dt; const p = Math.min(1, j.t / j.dur); j.fn(j.ease(p));
    if (p >= 1) { jobs.splice(i, 1); i--; j.res(); }
  }
}

/* ================== Ses ================== */
let AC = null, master = null, recDest = null, musicGain = null, noiseBuf = null, musicOn = true;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = .55; master.connect(AC.destination);
    recDest = AC.createMediaStreamDestination(); master.connect(recDest);
    musicGain = AC.createGain(); musicGain.gain.value = .16; musicGain.connect(master);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function tone(f, d, { type = 'sine', vol = .3, to = null, delay = 0, dest = null } = {}) {
  if (!AC) return; const t0 = AC.currentTime + Math.max(0, delay);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0 + d + .05);
}
function noise(d, { vol = .3, f = 1000, to = null, q = 1, type = 'bandpass', delay = 0, dest = null } = {}) {
  if (!AC) return; const t0 = AC.currentTime + Math.max(0, delay);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t0);
  if (to) fl.frequency.exponentialRampToValueAtTime(to, t0 + d);
  const g = AC.createGain(); g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  s.connect(fl); fl.connect(g); g.connect(dest || master); s.start(t0); s.stop(t0 + d + .05);
}
const semi = (b, s) => b * Math.pow(2, s / 12);
const sfx = {
  pop: (p = 1) => tone(420 * p, .14, { to: 900 * p, vol: .25 }),
  tick: () => tone(1100, .06, { type: 'square', vol: .07 }),
  go: () => { tone(660, .12, { type: 'triangle', vol: .2 }); tone(990, .3, { type: 'triangle', vol: .2, delay: .1 }); },
  swoosh: () => noise(.22, { vol: .55, f: 500, to: 5000, q: .8 }),
  boom: () => { tone(150, .6, { vol: .7, to: 40 }); noise(.45, { vol: .35, f: 500, to: 80, type: 'lowpass' }); },
  clang: () => { tone(1760, .6, { type: 'triangle', vol: .12, to: 1700 }); tone(2637, .4, { vol: .07 }); },
  zap: () => { tone(1300, .25, { type: 'sawtooth', vol: .07, to: 200 }); noise(.2, { vol: .2, f: 3000 }); },
  magic: () => [0, 4, 7, 12, 16].forEach((s, i) => tone(semi(523, s), .25, { type: 'triangle', vol: .12, delay: i * .06 })),
  whistle: () => tone(1400, .9, { vol: .1, to: 300 }),
  shrink: () => tone(600, .7, { type: 'square', vol: .045, to: 180 }),
  hum: () => tone(90, 1.1, { type: 'sawtooth', vol: .05, to: 150 }),
  win: () => [0, 4, 7, 12].forEach((s, i) => tone(semi(523, s), .4, { type: 'triangle', vol: .16, delay: i * .08 })),
  land: () => noise(.12, { vol: .3, f: 220, type: 'lowpass' }),
  boss: () => { tone(110, 1.2, { type: 'sawtooth', vol: .12, to: 55 }); tone(116, 1.2, { type: 'sawtooth', vol: .1, to: 58 }); },
};
/* basit arka plan müziği (A minör pentatonik) */
let nextNoteT = 0, step = 0;
const BPM = 112, ROOTS = [57, 53, 55, 52];
const mhz = m => 440 * Math.pow(2, (m - 69) / 12);
function musicTick() {
  if (!AC || !musicOn || paused || !running) { if (AC) nextNoteT = AC.currentTime + .05; return; }
  const spb = 60 / BPM / 2;
  if (nextNoteT < AC.currentTime) nextNoteT = AC.currentTime + .05;
  while (nextNoteT < AC.currentTime + .2) {
    const delay = nextNoteT - AC.currentTime, i = step % 8, r = ROOTS[Math.floor(step / 8) % 4];
    if (i % 4 === 0) tone(110, .18, { vol: .5, to: 40, delay, dest: musicGain });
    if (i % 2 === 1) noise(.04, { vol: .12, f: 8000, type: 'highpass', delay, dest: musicGain });
    if (i === 0 || i === 3 || i === 6) tone(mhz(r - 12), .22, { type: 'triangle', vol: .35, delay, dest: musicGain });
    if (i % 2 === 0) tone(mhz(r + [0, 3, 7, 10][(step / 2) % 4 | 0] + 12), .16, { type: 'square', vol: .05, delay, dest: musicGain });
    nextNoteT += spb; step++;
  }
}
setInterval(musicTick, 50);

/* ================== Yerleşim & arka plan ================== */
let bg = null, vig = null, bgStars = [], floaters = [], petals = [];
function layout() {
  W = vertical ? 720 : 1280; H = vertical ? 1280 : 720;
  cv.width = W * R; cv.height = H * R;
  U = 1;
  G = vertical ? H * .7 : H * .83;
  CX = vertical ? W * .5 : W * .55;
  D = vertical ? 200 : 240;
  HOME = vertical ? 70 : W * .1;
  document.getElementById('wrap').classList.toggle('vertical', vertical);
  buildBg();
}
function buildBg() {
  bg = document.createElement('canvas'); bg.width = W * R; bg.height = H * R;
  const b = bg.getContext('2d'); b.scale(R, R);
  b.fillStyle = '#f2eee3'; b.fillRect(0, 0, W, H);
  // kağıt dokusu
  for (let i = 0; i < 3000; i++) { b.fillStyle = `rgba(120,100,70,${rand(.02, .06).toFixed(3)})`; b.fillRect(rand(0, W), rand(0, H), rand(.6, 1.8), rand(.6, 1.8)); }
  // defter çizgileri
  b.strokeStyle = 'rgba(110,145,210,.42)'; b.lineWidth = 1.4;
  for (let y = 96; y < H; y += 34) { b.beginPath(); b.moveTo(0, y); b.lineTo(W, y); b.stroke(); }
  const mx = vertical ? 46 : 74;
  b.strokeStyle = 'rgba(220,105,105,.55)'; b.lineWidth = 1.6;
  b.beginPath(); b.moveTo(mx, 0); b.lineTo(mx, H); b.stroke();
  // zemin: kurşun kalemle çizilmiş çizgi
  b.lineCap = 'round';
  for (let k = 0; k < 2; k++) {
    b.strokeStyle = `rgba(45,45,70,${k ? .3 : .6})`; b.lineWidth = k ? 1.5 : 2.6; b.beginPath();
    for (let x = -10; x <= W + 10; x += 18) { const y = G + Math.sin(x * .04 + k * 3) * 1.2 + rand(-.7, .7) + k * 3; x < 0 ? b.moveTo(x, y) : b.lineTo(x, y); }
    b.stroke();
  }
  b.strokeStyle = 'rgba(45,45,70,.1)'; b.lineWidth = 1.4;
  for (let x = 0; x < W + 40; x += 13) { b.beginPath(); b.moveTo(x, G + 8); b.lineTo(x - 16, G + 26); b.stroke(); }
  bgStars = []; petals = [];
  vig = document.createElement('canvas'); vig.width = W * R; vig.height = H * R;
  const vg = vig.getContext('2d'); vg.scale(R, R);
  const vgr = vg.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .4, W / 2, H / 2, Math.max(W, H) * .78);
  vgr.addColorStop(0, 'rgba(110,85,50,0)'); vgr.addColorStop(1, 'rgba(110,85,50,.22)');
  vg.fillStyle = vgr; vg.fillRect(0, 0, W, H);
  floaters = []; const syms = ['+', '−', '×', '÷', '=', 'π', '√', '%'];
  for (let i = 0; i < 14; i++) floaters.push({ x: rand(0, W), y: rand(0, H), s: syms[i % syms.length], size: rand(26, 60), v: rand(.006, .02), rot: rand(-.4, .4) });
}

/* ================== Sahne ================== */
let S, hero;
function makeHero() { return { arm2: .35, wink: 0, mouth: 0, dustT: 0, x: -120, hop: 0, dir: 1, armA: .5, tool: null, walk: 0, phase: 0, s: .85, rot: 0, sqx: 1, sqy: 1, lastX: -120, bubble: null, ghosts: [], dash: false, glint: 0, brow: 0, happy: 0 }; }
function resetScene() {
  jobs.length = 0;
  S = { blobs: [], pieces: [], texts: [], parts: [], slashes: [], bolts: [], rings: [], mstars: [], rays: [], field: null, shake: 0, flash: 0, flashColor: '#fff', hud: null, count: null, title: null, cards: [], end: null, hint: false,
    cam: { x: W / 2, y: H / 2, z: 1 }, hitstop: 0, slow: 1, invert: 0, lines: null };
  hero = makeHero();
}

/* ---------- sayılar: kalın, elle çizilmiş rakamlar ---------- */
const INK = '#1d1f3b', SHADE = '#c9cce6', SCARF = '#e04b4b';
const glyphFS = v => (104 + Math.sqrt(Math.max(1, v)) * 3.5) * U;
const nDigits = v => String(Math.round(Math.max(0, v))).length;
const baseR = v => Math.max(nDigits(v) * .3, .42) * glyphFS(v);
class NumBlob {
  constructor(v, x) {
    this.v = v; this.disp = v; this.x = x; this.y = G; this.hop = 0; this.s = 0; this.sx = 1; this.sy = 1; this.rot = 0; this.alpha = 1;
    this.mood = 'happy'; this.color = colorFor(v); this.look = 0; this.lookFixed = false; this.seed = rand(0, 10);
    this.ground = true; this.tag = null; this.glow = 0;
  }
  get r() { return baseR(this.disp); }
  get hh() { return glyphFS(this.disp) * .42; }
  update(dt) {
    if (this.ground) this.y = G - this.hh * this.s * this.sy - this.hop;
    this.glow = Math.max(0, this.glow - dt * .0015);
  }
  draw() {
    if (this.s <= .001 || this.alpha <= 0) return;
    ctx.save();
    const fr = Math.floor(time / 110);                         // çizgi "kaynaması" (el çizimi titreşimi)
    let tx = this.x + Math.sin(fr * 12.99 + this.seed * 7) * 1.1 * U, ty = this.y + Math.cos(fr * 9.7 + this.seed) * 1.1 * U;
    if (this.mood === 'scared') tx += Math.sin(time * .09 + this.seed) * 2.5 * U;
    if (this.mood === 'joy') ty -= Math.abs(Math.sin(time * .012 + this.seed)) * 5 * U;
    ctx.translate(tx, ty); ctx.rotate(this.rot + Math.sin(fr * 7.1 + this.seed) * .02);
    ctx.scale(this.s * this.sx, this.s * this.sy); ctx.globalAlpha *= this.alpha;
    this.body(); ctx.restore();
    if (this.tag) {
      const ty2 = this.y - this.hh * this.s - 30 * U;
      ctx.save(); ctx.font = F(24 * U); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = SCARF; circle(this.x, ty2, 18 * U); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.fillText(this.tag, this.x, ty2 + 1); ctx.restore();
    }
  }
  body() {
    const fs = glyphFS(this.disp), txt = String(Math.round(this.disp)), by = fs * .36;
    ctx.font = F(fs); ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
    if (this.glow > 0) { ctx.shadowColor = '#ffc93c'; ctx.shadowBlur = 55 * this.glow; }
    ctx.lineWidth = fs * .17; ctx.strokeStyle = INK; ctx.strokeText(txt, 0, by);
    ctx.shadowBlur = 0;
    ctx.fillStyle = SHADE; ctx.fillText(txt, 0, by);
    ctx.fillStyle = this.glow > .3 ? '#fff6cf' : '#fff'; ctx.fillText(txt, -fs * .035, by - fs * .03);
  }
}

/* ---------- metin, parçacık, efektler ---------- */
function addText(o) { const t = Object.assign({ x: 0, y: 0, size: 60, color: '#fff', stroke: '#1b1446', s: 1, alpha: 1, rot: 0, text: '' }, o); S.texts.push(t); return t; }
function removeText(t) { S.texts = S.texts.filter(x => x !== t); }
function popWord(text, x, y, o = {}) {
  const t = addText({ text, x, y, size: (o.size || 64) * U, color: o.color || '#ffcf3f', stroke: o.stroke || '#2a1458', s: 0, rot: o.rot ?? rand(-.12, .12), burst: o.burst || null });
  (async () => { await tween(t, { s: 1 }, 260, E.back); await wait(o.hold ?? 750); await tween(t, { alpha: 0, y: t.y - 40 * U, s: 1.15 }, 300); removeText(t); })();
  return t;
}
function burst(x, y, n, o = {}) {
  const cols = o.colors || [INK, '#ffcf3f', SCARF, '#4cc9f0'];
  for (let i = 0; i < n; i++) {
    const a = o.dir !== undefined ? o.dir + (Math.random() - .5) * (o.spread || 1) : Math.random() * Math.PI * 2;
    const sp = (o.speed || .5) * (.4 + Math.random());
    S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), g: o.g ?? .0012, life: (o.life || 800) * rand(.6, 1.2), age: 0,
      size: (o.size || 6) * rand(.6, 1.4) * U, color: cols[i % cols.length], shape: o.shape || 'circle', rot: rand(0, 6), vr: rand(-.02, .02), bounce: !!o.bounce });
  }
}
function confetti() { for (let i = 0; i < 5; i++) burst(W * rand(.1, .9), -10, 26, { dir: Math.PI / 2, spread: 1.4, speed: .35, shape: 'rect', life: 2600, g: .00035, colors: PAL, size: 7 }); }
function slash(x1, y1, x2, y2, o = {}) { S.slashes.push({ x1, y1, x2, y2, age: 0, life: o.life || 450, w: (o.w || 10) * U, color: o.color || '#3a7bd5' }); }
function bolt(x1, y1, x2, y2) {
  const pts = [], n = 10; for (let i = 0; i <= n; i++) { const t = i / n, j = (i === 0 || i === n) ? 0 : rand(-18, 18) * U; pts.push({ x: x1 + (x2 - x1) * t - (y2 - y1) / Math.hypot(x2 - x1, y2 - y1) * j, y: y1 + (y2 - y1) * t + (x2 - x1) / Math.hypot(x2 - x1, y2 - y1) * j }); }
  S.bolts.push({ pts, age: 0, life: 350 });
}
function ring(x, y, max = 220, color = INK) { S.rings.push({ x, y, age: 0, life: 520, max: max * U, color }); }
function impact(x, y, o = {}) {
  sfx.boom(); S.shake = (o.shake || 16) * U; S.flash = o.flash ?? .55; S.flashColor = o.flashColor || '#fff';
  ring(x, y, o.ring || 240, o.ringColor || INK);
  burst(x, y, 36, { speed: .7, shape: 'star', colors: o.colors });
}
function camTo(x, y, z, dur = 400, ease = E.io) { return tween(S.cam, { x, y, z }, dur, ease); }
function camReset(dur = 500) { return camTo(W / 2, H / 2, 1, dur); }

  ctx.restore();

function update(dt) {

    const s = stars[i], tx = slots[i], ty = G - A.hh * sc, sx0 = s.x, sy0 = s.y;
    await anim(240, t => { s.x = sx0 + (tx - sx0) * t; s.y = sy0 + (ty - sy0) * t - Math.sin(Math.PI * t) * 60 * U; }, E.io);
    S.mstars = S.mstars.filter(x => x !== s);
    burst(tx, ty, 16, { colors: ['#ffe066', '#fff', A.color], shape: 'star', speed: .35 });
    sfx.pop(1 + i * .15);
    if (i === 0) { A.glow = 1; continue; }
    ring(tx, ty, 90, '#ffe066');
    const c = addBlob(a, tx); c.color = A.color; c.mood = 'joy'; c.tag = String(i + 1);
    tween(c, { s: sc }, 320, E.back); clones.push(c);
  }
  const f = addText({ text: Array(n).fill(a).join(' + '), x: mid, y: G + (H - G) * .45, size: (vertical ? 46 : 42) * U, color: '#fff', s: 0 });
  tween(f, { s: 1 }, 320, E.back);
  await wait(1100);
  popWord('HEPSİ BİR OLSUN!', mid, G - 330 * U, { color: '#fff', burst: '#ffa62b', size: 54 });
  anim(700, t => hero.armA = 2.6 + Math.sin(t * Math.PI * 4) * .5);
  clones.forEach(c => c.tag = null);
  heroJumpTo(mid - baseR(a * n) - 90 * U, 0, 900, 60).then(() => { hero.dir = 1; tween(hero, { armA: .5 }, 300); });
  await Promise.all(clones.map(c => blobHop(c, mid, 150 * U, 650, E.in)));
  impact(mid, G - A.hh * sc, { colors: [A.color, '#ffe066', '#fff', '#c77dff'], ringColor: '#c77dff' });
  hitStop(90); camPunch(mid, G - 120 * U, 1.25); raysAt(mid, G - baseR(a * n), '#e0b3ff', 900);
  clones.forEach(removeBlob);
  tween(f, { alpha: 0 }, 300).then(() => removeText(f));
  const C = addBlob(a * n, mid); C.s = .5; C.mood = 'joy'; C.glow = 1;
  tween(C, { s: 1 }, 800, E.elastic);
  popWord(`${n} tane ${a} = ${a * n}`, mid, G - baseR(a * n) * 2 - 60 * U, { size: 50, color: '#3ddc97' });
  await wait(900); C.mood = 'happy';
  return [C];
}

/* BÖLME: kılıçla tek hamlede eşit parçalara keser, parçalar yeni sayılara dönüşür */
async function solveDiv(A, op, B) {
  const n = B.v, q = A.v / n;
  await equip('sword'); say('Kılıcım hazır!', 900);
  popWord(`${n} eşit parça!`, B.x, G - 330 * U, { color: '#ffa62b' });
  tween(op, { s: 0, alpha: 0 }, 250).then(() => removeText(op));
  B.mood = 'joy'; await wait(350);
  await tween(B, { s: 0 }, 280, E.in); removeBlob(B);
  burst(B.x, G - B.r, 16, { colors: [B.color, '#fff'], speed: .4 });
  A.mood = 'scared'; A.lookFixed = true; A.look = -1;
  await tween(A, { x: CX }, 450);
  const r = A.r;
  await heroRunTo(A.x - r - 110 * U, undefined, true);
  hero.brow = 1;
  await tween(hero, { armA: 3.1 }, 300, E.out);
  hero.glint = 1; sfx.clang();
  camTo((hero.x + A.x) / 2, G - 140 * U, 1.3, 500);
  popWord('HİYAAA!', hero.x + 30 * U, G - 260 * U, { color: '#fff', burst: '#ffa62b', size: 58 });
  await wait(550);
  speedLines(500);
  // hızlı atılış + kesikler
  hero.dash = true;
  const ang = .22, cuts = [...Array(n - 1)].map((_, i) => -r + 2 * r * (i + 1) / n);
  const x0 = hero.x, x1 = A.x + r + 120 * U, ca = Math.cos(ang), sa = Math.sin(ang), L = r * 1.35;
  let made = 0; sfx.swoosh();
  await anim(280, t => {
    hero.x = x0 + (x1 - x0) * t; hero.armA = 3.1 - t * 2.6;
    const k = Math.min(n - 1, Math.floor(t * n));
    while (made < k) {
      const c = cuts[made];
      slash(A.x + c * ca + L * sa, A.y + c * sa - L * ca, A.x + c * ca - L * sa, A.y + c * sa + L * ca, { life: 1000, w: 12 });
      sfx.swoosh(); made++;
    }
  }, E.io);
  hero.dash = false; hero.dir = 1;
  hitStop(160, 90); S.flash = .4;
  camReset(700);
  await tween(hero, { armA: .35 }, 500);
  say('Zaten kesildin.', 900);
  await wait(700);
  sfx.clang(); S.shake = 8 * U;
  // parçalara ayrıl
  removeBlob(A);
  const pieces = [...Array(n)].map((_, i) => ({ b: A, x0: i === 0 ? -r * 3 : cuts[i - 1], x1: i === n - 1 ? r * 3 : cuts[i], dx: 0, dy: 0, rot: 0, ang, alpha: 1 }));
  S.pieces.push(...pieces);
  burst(A.x, A.y, 24, { colors: ['#fff', '#bff6ff', A.color], speed: .6, shape: 'star' });
  ring(A.x, A.y, 260, '#bff6ff');
  S.slow = .3; tween(S, { slow: 1 }, 260, E.in);
  heroRunTo(HOME, 700, true);
  const mid = vertical ? W / 2 : CX, want = baseR(q) * 2.4, spacing = Math.min(want, (W * .9) / n), sc = Math.min(1, spacing / want);
  const slots = [...Array(n)].map((_, i) => mid + (i - (n - 1) / 2) * spacing);
  const mids = pieces.map((_, i) => -r + 2 * r * (i + .5) / n);
  await Promise.all(pieces.map((p, i) => anim(600, t => {
    p.dx = (slots[i] - A.x - mids[i] * ca) * t; p.dy = -Math.sin(t * Math.PI) * 60 * U; p.rot = (i - (n - 1) / 2) * .12 * Math.sin(t * Math.PI);
  }, E.out)));
  const res = [];
  for (let i = 0; i < n; i++) {
    S.pieces = S.pieces.filter(p => p !== pieces[i]);
    const c = addBlob(q, slots[i]); c.mood = 'joy'; c.tag = String(i + 1);
    burst(slots[i], G - baseR(q) * sc, 14, { colors: [c.color, '#fff'], speed: .35 });
    sfx.pop(1 + i * .12); tween(c, { s: sc }, 320, E.back); res.push(c);
    await wait(130);
  }
  hero.brow = 0;
  popWord(`Her parça ${q}!`, mid, G - baseR(q) * 2 * sc - 70 * U, { size: 54, color: '#fff', burst: '#00bb7f' });
  await wait(900);
  res.forEach(c => { c.tag = null; c.mood = 'happy'; });
  return res;
}
const SOLVE = { '+': solveAdd, '−': solveSub, '×': solveMul, '÷': solveDiv };

/* ================== Akış ================== */
async function countdown(n = 3) {
  S.count = { n, p: 0, x: CX, y: vertical ? H * .3 : G - 330 * U, s: 0 };
  await tween(S.count, { s: 1 }, 250, E.back);
  for (let i = n; i >= 1; i--) { S.count.n = i; sfx.tick(); ring(S.count.x, S.count.y, 110, '#ffcf3f'); await anim(1000, t => S.count.p = t); }
  popWord('BAŞLA!', S.count.x, S.count.y, { color: '#fff', burst: '#ff3b5c', size: 60, hold: 350 });
  sfx.go(); await tween(S.count, { s: 0 }, 200, E.in); S.count = null;
}
const PRAISE = ['SÜPER!', 'HARİKA!', 'MÜKEMMEL!', 'EFSANE!', 'BRAVO!'];
async function reveal(ans, res = []) {
  res.forEach(b => { raysAt(b.x, b.y, '#ffd84d', 1500, 200); b.glow = 1; b.mood = 'joy'; });
  const h = S.hud; h.ans = ans; h.ansS = 0; sfx.win();
  tween(h, { ansS: 1 }, 450, E.back);
  burst(W / 2, (vertical ? H * .12 : 84), 30, { colors: ['#3ddc97', '#ffcf3f', '#fff'], shape: 'star', speed: .5 });
  confetti();
  popWord(PRAISE[Math.floor(Math.random() * PRAISE.length)], hero.x + 40 * U, G - 270 * U, { size: 58, color: '#3ddc97' });
  await heroCheer();
  await wait(1100);
}
async function clearStage() {
  camReset(400);
  heroRunTo(HOME, undefined, true);
  const bs = [...S.blobs];
  await Promise.all(bs.map((b, i) => wait(i * 70).then(() => { sfx.pop(.7); return tween(b, { s: 0 }, 260, E.in); })));
  S.blobs = []; S.pieces = [];
  if (S.hud) { await tween(S.hud, { off: -300 }, 350, E.in); S.hud = null; }
}
function makeHud(expr, op, extra = {}) {
  const info = OPINFO[op];
  S.hud = Object.assign({ expr, ans: null, ansS: 0, idx: 1, total: 1, label: info.name, sub: info.power, color: info.color, off: -300, boss: false, step: '' }, extra);
  return tween(S.hud, { off: 0 }, 450, E.back);
}
async function playQuestion(q, idx, total, custom = false) {
  if (hero.x < 0) heroRunTo(HOME, 600, true);
  await makeHud(`${q.a} ${q.op} ${q.b}`, q.op, { idx, total, custom });
  let [a, b] = [q.a, q.b];
  if (q.op === '×' && b > 6 && a <= 6) [a, b] = [b, a];   // kopya sayısı küçük olan
  const A = await spawnBlob(a, CX - D);
  const op = await spawnOp(q.op, CX);
  const B = await spawnBlob(b, CX + D);
  say(['Hmm...', 'Bu kolay!', 'Hazır mısın?'][idx % 3], 1100);
  await countdown(3);
  const res = await SOLVE[q.op](A, op, B);
  await reveal(compute(q.a, q.op, q.b), res);
  await clearStage();
}
async function addOperand(A, sym, b) {
  heroRunTo(HOME, 600, true);
  A.mood = 'happy';
  await blobHop(A, CX - D, 80 * U, 500);
  const op = await spawnOp(sym, CX);
  const B = await spawnBlob(b, CX + D);
  await wait(300);
  return { op, B };
}
async function playBoss(idx, total) {
  S.flashColor = '#ff3b5c'; S.flash = .6; S.shake = 18 * U; sfx.boss(); speedLines(1300); camPunch(W / 2, H / 2, 1.15);
  popWord('BOSS SORUSU!', W / 2, H * .42, { size: vertical ? 80 : 110, color: '#fff', burst: '#ff3b5c', hold: 1100, rot: -.06 });
  await wait(1700);
  const expr = '(6 + 2) × 3 ÷ 4';
  await makeHud(expr, '+', { boss: true, label: 'KARIŞIK', sub: 'Önce parantez, sonra soldan sağa', color: '#ff3b5c', idx, total });
  const A = await spawnBlob(6, CX - D), op = await spawnOp('+', CX), B = await spawnBlob(2, CX + D);
  say('Bu zor görünüyor...', 1200);
  await countdown(5);
  S.hud.step = '1. adım: 6 + 2';
  let [C] = await solveAdd(A, op, B);
  S.hud.step = '2. adım: 8 × 3';
  let o = await addOperand(C, '×', 3);
  [C] = await solveMul(C, o.op, o.B);
  S.hud.step = '3. adım: 24 ÷ 4';
  o = await addOperand(C, '÷', 4);
  const res = await solveDiv(C, o.op, o.B);
  S.hud.step = '';
  await reveal(6, res);
  await clearStage();
}
async function intro() {
  S.title = { s: 0, a: 1 }; hero.x = -120; hero.tool = null;
  sfx.swoosh();
  await tween(S.title, { s: 1 }, 600, E.back);
  sfx.swoosh();
  await heroRunTo(W / 2, 1500, true);
  say('Merhaba! Ben Nod.', 1500); hero.mouth = 1;
  await wave(1500); hero.mouth = 0;
  hero.happy = 1; tween(hero, { armA: 3, arm2: 2.9 }, 200, E.out);
  say('Yuhuu!', 900);
  await heroJumpTo(hero.x, 0, 650, 130);
  ring(hero.x, G, 200, '#ffcf3f'); S.shake = 6 * U;
  tween(hero, { armA: .5, arm2: .35 }, 300); hero.happy = 0;
  await wait(300);
  const list = [['+', 'magnet', 'TOPLAMA', 'Mıknatıs', OPINFO['+'].color], ['−', 'hammer', 'ÇIKARMA', 'Çekiç', OPINFO['−'].color],
  ['×', 'wand', 'ÇARPMA', 'Sihirli Değnek', OPINFO['×'].color], ['÷', 'sword', 'BÖLME', 'Kılıç', OPINFO['÷'].color]];
  S.cards = list.map(([op, tool, name, label, color], i) => vertical
    ? { op, tool, name, label, color, s: 0, x: W / 2 + (i % 2 ? 1 : -1) * 100 * U, y: H * .34 + Math.floor(i / 2) * 190 * U }
    : { op, tool, name, label, color, s: 0, x: W / 2 + (i - 1.5) * 200, y: H * .45 });
  for (const c of S.cards) {
    await equip(c.tool);
    tween(hero, { armA: 2.8 }, 200, E.out).then(() => tween(hero, { armA: .5 }, 300));
    sfx.pop(1.2); await tween(c, { s: 1 }, 320, E.back);
    await wait(380);
  }
  hero.tool = null;
  await wait(500);
  S.cards.forEach((c, i) => wait(i * 60).then(() => tween(c, { s: 0 }, 250, E.in)));
  await wait(450);
  say('Hadi soruları birlikte çözelim!', 1300);
  await wait(1500);
  await tween(S.title, { s: 0 }, 400, E.in);
  S.title = null; S.cards = [];
  await heroRunTo(HOME, 700, true);
}
const QUESTIONS = [
  { a: 8, op: '+', b: 5 }, { a: 12, op: '÷', b: 3 }, { a: 15, op: '−', b: 6 }, { a: 4, op: '×', b: 3 },
  { a: 7, op: '+', b: 9 }, { a: 20, op: '÷', b: 4 }, { a: 18, op: '−', b: 9 }, { a: 5, op: '×', b: 4 },
];
async function finale(total) {
  hero.tool = null;
  S.end = { s: 0, line1: `${total} soruyu birlikte çözdük!`, line2: 'Sen kaçını bildin? Yorumlara yaz!' };
  sfx.win(); tween(S.end, { s: 1 }, 600, E.back);
  heroRunTo(W / 2, 900, true);
  for (let i = 0; i < 4; i++) { confetti(); firework(rand(W * .15, W * .85), rand(H * .1, H * .4)); await wait(450); }
  (async () => { for (let i = 0; i < 8; i++) { firework(rand(W * .1, W * .9), rand(H * .08, H * .45)); await wait(600); } })();
  say('Yuhuu!', 900);
  await heroCheer(); await heroCheer();
  hero.wink = 1; hero.mouth = 1;
  say('Abone olmayı unutma!', 2600);
  await wave(2600, 2.2);
  hero.wink = 0; hero.mouth = 0;
  say('Görüşürüz!', 1500);
  await wait(1700);
  (async () => { for (let i = 0; ; i++) { firework(rand(W * .1, W * .9), rand(H * .08, H * .4)); if (i % 3 === 2) heroCheer(); await wait(rand(700, 1300)); } })();
}
async function playAll() {
  await intro();
  const total = QUESTIONS.length + 1;
  for (let i = 0; i < QUESTIONS.length; i++) await playQuestion(QUESTIONS[i], i + 1, total);
  await playBoss(total, total);
  await finale(total);
}
async function playCustom(q) {
  hero.x = -100;
  await playQuestion(q, 1, 1, true);
  say('Başka bir soru yaz!', 2500);
}

/* ================== Kontroller ================== */
const btnStart = document.getElementById('btnStart'), btnPause = document.getElementById('btnPause'), btnRec = document.getElementById('btnRec');
const msg = document.getElementById('msg');
function setMsg(t, ok = false) { msg.textContent = t; msg.classList.toggle('ok', ok); }
async function startRun(kind, payload) {
  initAudio();
  runToken++; const my = runToken;
  resetScene(); started = true; running = true; paused = false; updatePauseBtn();
  btnStart.textContent = '↺ Baştan';
  if (kind === 'all') await playAll(); else await playCustom(payload);
  if (my !== runToken) return;
  running = false;
  if (kind === 'all' && rec) setTimeout(() => rec && rec.stop(), 600);
}
function showIdle() { resetScene(); S.title = { s: 1, a: 1 }; S.hint = true; hero.x = W / 2; hero.lastX = hero.x; }
function updatePauseBtn() { btnPause.textContent = paused ? '▶ Devam' : '⏸ Duraklat'; }
function togglePause() {
  if (!started) return;
  paused = !paused; updatePauseBtn();
  if (AC) paused ? AC.suspend() : AC.resume();
}
btnStart.onclick = () => startRun('all');
btnPause.onclick = togglePause;
cv.addEventListener('click', () => { if (!started) startRun('all'); else togglePause(); });
document.getElementById('speed').onchange = e => speed = parseFloat(e.target.value);
document.getElementById('btnOrient').onclick = e => {
  vertical = !vertical; e.target.textContent = vertical ? '🖥 Yatay (16:9)' : '📱 Dikey (9:16)';
  layout(); if (started) startRun('all'); else showIdle();
};
document.getElementById('btnMusic').onclick = e => { musicOn = !musicOn; e.target.textContent = musicOn ? '🎵 Müzik: Açık' : '🎵 Müzik: Kapalı'; };
addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); togglePause(); } });

document.getElementById('customForm').addEventListener('submit', e => {
  e.preventDefault();
  const raw = document.getElementById('custom').value.trim();
  const m = raw.match(/^(\d{1,3})\s*([+\-−–x×*\/÷:])\s*(\d{1,3})$/i);
  if (!m) return setMsg('Soruyu "12 + 5", "9 - 4", "6 x 3" ya da "20 / 4" biçiminde yaz.');
  const a = +m[1], b = +m[3];
  const op = { '+': '+', '-': '−', '−': '−', '–': '−', 'x': '×', 'X': '×', '×': '×', '*': '×', '/': '÷', '÷': '÷', ':': '÷' }[m[2]];
  if (a < 1 || b < 1) return setMsg('Sayılar en az 1 olmalı.');
  if (op === '+' && (a > 60 || b > 60)) return setMsg('Toplamada sayılar en fazla 60 olabilir.');
  if (op === '−' && (a > 99 || b >= a)) return setMsg('Çıkarmada ilk sayı ikinciden büyük ve en fazla 99 olmalı.');
  if (op === '×' && (Math.min(a, b) > 6 || a * b > 144)) return setMsg('Çarpmada sayılardan biri en fazla 6, sonuç en fazla 144 olmalı.');
  if (op === '÷' && (b < 2 || b > 6 || a > 120)) return setMsg('Bölmede bölen 2 ile 6 arasında, bölünen en fazla 120 olmalı.');
  if (op === '÷' && a % b) return setMsg(`${a}, ${b}'e tam bölünmüyor. Kalansız bir bölme dene.`);
  setMsg(`Nod ${a} ${op} ${b} sorusunu çözüyor!`, true);
  startRun('custom', { a, op, b });
});

/* video kaydı */
let rec = null;
btnRec.onclick = () => {
  if (rec) { rec.stop(); return; }
  initAudio();
  if (!window.MediaRecorder || !cv.captureStream) return setMsg('Bu tarayıcı video kaydını desteklemiyor. Chrome ya da Edge dene.');
  const stream = cv.captureStream(60);
  if (recDest) recDest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
  const mime = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'].find(t => MediaRecorder.isTypeSupported(t));
  if (!mime) return setMsg('Bu tarayıcı video kaydını desteklemiyor.');
  const chunks = [];
  rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8e6 });
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'nod-ile-matematik.' + (mime.includes('mp4') ? 'mp4' : 'webm'); a.click();
    rec = null; btnRec.textContent = '⏺ Video Kaydet'; btnRec.classList.remove('on');
    setMsg('Video indirildi.', true);
  };
  rec.start(); btnRec.textContent = '⏹ Kaydı Bitir'; btnRec.classList.add('on');
  setMsg('Kayıt başladı. Gösteri bitince video otomatik iner.', true);
  startRun('all');
};

/* başlat */
layout(); showIdle();
(document.fonts ? document.fonts.load(F(40)).catch(() => { }) : Promise.resolve()).finally(() => requestAnimationFrame(t => { last = t; frame(t); }));
</script>
