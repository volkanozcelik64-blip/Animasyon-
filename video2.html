<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sayıların Sihri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans:wght@500;700&display=swap">
<style>
/* Beyaz sahne (dikey 9:16 canvas), altında küçük kumanda paneli. */
:root{
  --bg:#f1f1f4;
  --panel:#ffffff;
  --line:#d6d6de;
  --fg:#16161f;
  --muted:#6b6b78;
  --accent:#e04848;
  --on-accent:#ffffff;
  --font-ui:"Fredoka","Arial Rounded MT Bold",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#121216;--panel:#1c1c22;--line:#33333d;--fg:#f2f2f2;--muted:#9a9aa8;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#121216;--panel:#1c1c22;--line:#33333d;--fg:#f2f2f2;--muted:#9a9aa8;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-ui);padding-inline:16px;padding-block:16px 28px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.stage-wrap{width:min(100%,calc(80vh*16/9));margin:0 auto}
.stage-wrap.vertical{width:min(100%,calc(80vh*9/16))}
canvas{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer}
.controls{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
button{font-family:var(--font-ui);font-size:1rem;font-weight:600;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--fg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.hint{color:var(--muted);font-size:.9rem;text-align:center;margin:0}
</style>
</head>
<body>
<div class="app">
  <div class="stage-wrap"><canvas id="stage" aria-label="Sayıların Sihri animasyonu"></canvas></div>
  <div class="controls">
    <button id="btnPlay" class="primary">▶ Oynat</button>
    <button id="btnPause">⏸ Duraklat</button>
    <button id="btnMusic">🎵 Müzik: Açık</button>
  </div>
  <p class="hint">9 hilesi, 142857, 111111111², 0,999… = 1 ve Ay'a kadar katlanan kâğıt. Boşluk tuşu: duraklat/devam.</p>
</div>
<script>
"use strict";
const QS = new URLSearchParams(location.search);
const RENDER = QS.has('render');
const VERT = QS.get('v') === '1';            // varsayılan yatay 16:9, ?v=1 dikey
const R = 1.5, W = VERT ? 720 : 1280, H = VERT ? 1280 : 720, ZF = VERT ? 1 : 1.05;
const INK = '#16161f', RED = '#e04848', PAPER = '#ffffff';
const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
cv.width = W * R; cv.height = H * R;
const EQF = (sz, w = 500) => `${w} ${Math.round(sz)}px "Noto Sans", "DejaVu Sans", Arial, sans-serif`;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const circle = (x, y, r) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); };

/* ---------- easing ve zaman çizelgesi ---------- */
const E = {
  lin: t => t,
  io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
  out: t => 1 - Math.pow(1 - t, 3),
  in: t => t * t * t,
  back: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  elastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * (2 * Math.PI) / 3) + 1,
};
const jobs = [];
function anim(dur, fn, ease = E.lin) { return new Promise(res => jobs.push({ t: 0, dur: Math.max(1, dur), fn, ease, res })); }
function tween(o, to, dur, ease = E.io) { const from = {}; for (const k in to) from[k] = o[k]; return anim(dur, t => { for (const k in to) o[k] = from[k] + (to[k] - from[k]) * t; }, ease); }
const wait = ms => anim(ms, () => { });
function runJobs(dt) {
  for (let i = 0; i < jobs.length; i++) {
    const j = jobs[i]; j.t += dt; const p = Math.min(1, j.t / j.dur); j.fn(j.ease(p));
    if (p >= 1) { jobs.splice(i, 1); i--; j.res(); }
  }
}

/* ================== Ses ================== */
let AC = null, master = null, musicGain = null, noiseBuf = null, musicOn = true, OFF = false, T0 = 0;
const events = [];
function setupAudio(c) {
  AC = c; master = AC.createGain(); master.gain.value = .55; master.connect(AC.destination);
  musicGain = AC.createGain(); musicGain.gain.value = .11; musicGain.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function initAudio() {
  if (RENDER) return;
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { setupAudio(new (window.AudioContext || window.webkitAudioContext)()); } catch (e) { AC = null; }
}
const now = () => OFF ? T0 : AC.currentTime;
function tone(f, d, { type = 'sine', vol = .3, to = null, delay = 0, dest = null } = {}) {
  if (!AC) return; const t0 = now() + Math.max(0, delay);
  const o = AC.createOscillator(), g = AC.createGain(); o.type = type;
  o.frequency.setValueAtTime(f, t0); if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
  g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0 + d + .05);
}
function noise(d, { vol = .3, f = 1000, to = null, q = 1, type = 'bandpass', delay = 0, dest = null } = {}) {
  if (!AC) return; const t0 = now() + Math.max(0, delay);
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const fl = AC.createBiquadFilter(); fl.type = type; fl.Q.value = q; fl.frequency.setValueAtTime(f, t0);
  if (to) fl.frequency.exponentialRampToValueAtTime(to, t0 + d);
  const g = AC.createGain(); g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + .01); g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  s.connect(fl); fl.connect(g); g.connect(dest || master); s.start(t0); s.stop(t0 + d + .05);
}
const semi = (b, s) => b * Math.pow(2, s / 12);
const SFX = {
  pop: (p = 1) => tone(420 * p, .14, { to: 900 * p, vol: .25 }),
  tick: () => tone(1100, .05, { type: 'square', vol: .06 }),
  swoosh: () => noise(.22, { vol: .55, f: 500, to: 5000, q: .8 }),
  boom: () => { tone(150, .6, { vol: .7, to: 40 }); noise(.45, { vol: .35, f: 500, to: 80, type: 'lowpass' }); },
  bigboom: () => { tone(110, 1.4, { vol: .8, to: 30 }); noise(1.2, { vol: .45, f: 900, to: 50, type: 'lowpass' }); tone(55, 1.6, { type: 'triangle', vol: .4, to: 30 }); },
  clang: () => { tone(1760, .6, { type: 'triangle', vol: .12, to: 1700 }); tone(2637, .4, { vol: .07 }); },
  magic: () => [0, 4, 7, 12, 16].forEach((s, i) => tone(semi(523, s), .25, { type: 'triangle', vol: .12, delay: i * .06 })),
  whistle: () => tone(1400, .9, { vol: .1, to: 300 }),
  rise: () => tone(200, 1.2, { type: 'sawtooth', vol: .05, to: 1200 }),
  win: () => [0, 4, 7, 12].forEach((s, i) => tone(semi(523, s), .4, { type: 'triangle', vol: .16, delay: i * .08 })),
  land: () => noise(.12, { vol: .3, f: 220, type: 'lowpass' }),
  ding: (p = 1) => { tone(880 * p, .3, { type: 'triangle', vol: .14 }); tone(1320 * p, .35, { type: 'sine', vol: .08, delay: .05 }); },
  spin: () => noise(1.0, { vol: .18, f: 400, to: 2400, q: 3 }),
  paper: () => noise(.18, { vol: .35, f: 2500, to: 1200, q: .7 }),
  wobble: () => tone(300, .5, { type: 'sine', vol: .15, to: 120 }),
};
const sfx = {};
for (const k in SFX) sfx[k] = (...a) => { if (RENDER) events.push({ t: vclock / 1000, k, a }); else SFX[k](...a); };
const BPM = 112, ROOTS = [60, 57, 53, 55];
const mhz = m => 440 * Math.pow(2, (m - 69) / 12);
function musicStep(step, t) {
  const delay = t - now(), i = step % 8, r = ROOTS[Math.floor(step / 8) % 4];
  if (i % 4 === 0) tone(105, .18, { vol: .45, to: 40, delay, dest: musicGain });
  if (i === 4) noise(.12, { vol: .18, f: 1800, delay, dest: musicGain });
  if (i % 2 === 1) noise(.04, { vol: .1, f: 8000, type: 'highpass', delay, dest: musicGain });
  if (i === 0 || i === 3 || i === 6) tone(mhz(r - 12), .22, { type: 'triangle', vol: .3, delay, dest: musicGain });
  if (i % 2 === 0) tone(mhz(r + [0, 4, 7, 11][(step / 2) % 4 | 0] + 12), .15, { type: 'square', vol: .04, delay, dest: musicGain });
}
let nextNoteT = 0, mstep = 0;
setInterval(() => {
  if (RENDER || !AC || !musicOn || paused || !running) { if (AC && !RENDER) nextNoteT = AC.currentTime + .05; return; }
  const spb = 60 / BPM / 2;
  if (nextNoteT < AC.currentTime) nextNoteT = AC.currentTime + .05;
  while (nextNoteT < AC.currentTime + .2) { musicStep(mstep++, nextNoteT); nextNoteT += spb; }
}, 50);

/* ================== Sahne durumu ================== */
let S, hero, time = 0, vclock = 0, paused = false, started = false, running = false;
function resetScene() {
  jobs.length = 0;
  S = { toks: [], parts: [], rings: [], eman: [], ghosts: [], syms: [], cam: { x: 0, y: -200, z: 1 }, shake: 0, flash: 0, flashColor: '#fff',
    hitstop: 0, slow: 1, invert: 0, lines: null, bars: 0, chroma: 0, camV: 0, lastCam: null, sky: 0, wheel: null, paper: null, moon: null, stars: [], dots: [], end: 0 };
  for (let i = 0; i < 160; i++) S.stars.push({ x: rand(-1, 1), y: rand(-1, 1), r: rand(.6, 2.2), tw: rand(0, 6) });
  for (let i = 0; i < 30; i++) S.dots.push({ x: rand(0, W), y: rand(0, H), r: rand(2, 6), a: rand(.04, .1), v: rand(.006, .02) });
  hero = makeHero();
}

/* ================== Karakter: kırmızı atkılı çöp adam ================== */
// Açılar aşağıdan ölçülür, + yön = yüzünün baktığı taraf. Kol: omuz açısı + dirsek bükümü; bacak: kalça açısı + diz bükümü.
const POSE = {
  stand: { lean: 0, aBs: -.42, aBe: -.35, aFs: .42, aFe: .35, lBh: -.2, lBk: 0, lFh: .2, lFk: 0, head: 0 },
  cheer: { lean: -.05, aBs: -2.55, aBe: -.25, aFs: 2.55, aFe: .25, lBh: -.25, lBk: 0, lFh: .25, lFk: 0, head: -.15 },
  shock: { lean: -.28, aBs: -2.0, aBe: -.7, aFs: 2.0, aFe: .7, lBh: -.45, lBk: 0, lFh: .35, lFk: -.2, head: -.12 },
  push: { lean: .5, aBs: 1.45, aBe: .15, aFs: 1.6, aFe: .1, lBh: -.65, lBk: 0, lFh: .45, lFk: -.55, head: .1 },
  proud: { lean: -.06, aBs: -.75, aBe: -2.5, aFs: .75, aFe: 2.5, lBh: -.28, lBk: 0, lFh: .28, lFk: 0, head: -.18 },
  scratch: { lean: 0, aBs: -.3, aBe: -.3, aFs: 2.5, aFe: 1.7, lBh: -.18, lBk: 0, lFh: .18, lFk: 0, head: .18 },
  crouch: { lean: .35, aBs: -.9, aBe: -.4, aFs: -.6, aFe: -.4, lBh: 1.0, lBk: -1.7, lFh: 1.15, lFk: -1.8, head: -.1 },
  air: { lean: .1, aBs: -2.4, aBe: -.4, aFs: 2.3, aFe: .5, lBh: .4, lBk: -1.4, lFh: 1.3, lFk: -1.1, head: -.1 },
  stomp: { lean: .05, aBs: -1.5, aBe: -.6, aFs: 1.5, aFe: .6, lBh: -.1, lBk: 0, lFh: .9, lFk: -1.6, head: .2 },
  punch: { lean: .35, aBs: -.9, aBe: 1.6, aFs: 1.65, aFe: 0, lBh: -.55, lBk: 0, lFh: .5, lFk: -.4, head: 0 },
  uppercut: { lean: -.1, aBs: -.7, aBe: 1.4, aFs: 2.9, aFe: .1, lBh: -.4, lBk: 0, lFh: .35, lFk: -.3, head: -.3 },
  tired: { lean: .7, aBs: .55, aBe: -.2, aFs: .6, aFe: -.1, lBh: -.1, lBk: .4, lFh: .5, lFk: -.6, head: .25 },
  sit: { lean: -.15, aBs: -.9, aBe: -.3, aFs: .9, aFe: .2, lBh: 1.57, lBk: 0, lFh: 1.45, lFk: -.15, head: 0 },
  wave: { lean: 0, aBs: -.42, aBe: -.35, aFs: 2.3, aFe: .6, lBh: -.2, lBk: 0, lFh: .2, lFk: 0, head: -.05 },
  fold: { lean: .55, aBs: 1.2, aBe: .4, aFs: 1.3, aFe: .3, lBh: .9, lBk: -1.6, lFh: 1.1, lFk: -1.7, head: .15 },
  flail: { lean: -.3, aBs: -2.8, aBe: -.9, aFs: 2.6, aFe: 1.2, lBh: -.7, lBk: -.6, lFh: .9, lFk: -.9, head: -.2 },
};
const PK = Object.keys(POSE.stand);
const L = { th: 34, sh: 34, torso: 52, up: 28, fo: 26, neck: 6, hr: 20 };
function makeHero() {
  return { x: 0, y: 0, hop: 0, dir: 1, s: 1.25, rot: 0, sqx: 1, sqy: 1, alpha: 1, p: Object.assign({}, POSE.stand), run: 0, phase: 0,
    eyes: 'dot', mouth: 'smile', blink: 0, lastX: 0, vx: 0, vy: 0, lastY: 0, ghost: false, sweat: 0, scarfT: 0, wiggle: 0 };
}
function pose(name, dur = 220, ease = E.out) { return tween(hero.p, POSE[name], dur, ease); }
function face(eyes, mouth) { hero.eyes = eyes; hero.mouth = mouth; }
const seg = (x, y, a, l) => ({ x: x + Math.sin(a) * l, y: y + Math.cos(a) * l });
function rig(h) {
  const p = Object.assign({}, h.p);
  if (h.run > 0) {
    const ph = h.phase, r = h.run, sp = Math.sin(ph);
    const run = { lean: .3, aBs: sp * 1.0, aBe: 1.4, aFs: -sp * 1.0, aFe: 1.4, lBh: Math.sin(ph) * .9, lBk: -.2 - 1.2 * Math.max(0, Math.sin(ph + 1.7)), lFh: -Math.sin(ph) * .9, lFk: -.2 - 1.2 * Math.max(0, Math.sin(ph + 1.7 + Math.PI)), head: 0 };
    for (const k of PK) p[k] = lerp(p[k], run[k], r);
  }
  const legs = ['B', 'F'].map(s => { const k = seg(0, 0, p['l' + s + 'h'], L.th); const f = seg(k.x, k.y, p['l' + s + 'h'] + p['l' + s + 'k'], L.sh); return { k, f }; });
  const hipH = Math.max(legs[0].f.y, legs[1].f.y);
  const hip = { x: 0, y: -hipH };
  const neck = seg(hip.x, hip.y, Math.PI - p.lean, L.torso);
  const head = seg(neck.x, neck.y, Math.PI - p.lean - p.head, L.neck + L.hr);
  const sh = seg(hip.x, hip.y, Math.PI - p.lean, L.torso - 4);
  const arms = ['B', 'F'].map(s => { const e = seg(sh.x, sh.y, p['a' + s + 's'], L.up); const w = seg(e.x, e.y, p['a' + s + 's'] + p['a' + s + 'e'], L.fo); return { e, w }; });
  return { p, legs: legs.map(l => ({ k: { x: l.k.x, y: l.k.y + hip.y }, f: { x: l.f.x, y: l.f.y + hip.y } })), hip, neck, head, sh, arms };
}
function heroPt(name) { // dünya koordinatında bir eklem
  const h = hero, r = rig(h); let pt = name === 'hand' ? r.arms[1].w : name === 'head' ? r.head : name === 'foot' ? r.legs[1].f : r.hip;
  return { x: h.x + pt.x * h.dir * h.s, y: h.y - h.hop + pt.y * h.s };
}
function drawHero(h, alpha = 1, ghost = false) {
  if (h.alpha <= 0) return;
  const r = rig(h);
  ctx.save(); ctx.globalAlpha *= alpha * h.alpha;
  ctx.translate(h.x, h.y - h.hop);
  const midY = r.hip.y * h.s;
  ctx.translate(0, midY); ctx.rotate(h.rot); ctx.translate(0, -midY);
  ctx.scale(h.s * h.dir * h.sqx, h.s * h.sqy);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const col = ghost ? '#9aa7c7' : INK;
  ctx.strokeStyle = col; ctx.lineWidth = 5.5;
  const line = (...pts) => { ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y); for (const q of pts.slice(1)) ctx.lineTo(q.x, q.y); ctx.stroke(); };
  // arka bacak + kol
  line(r.hip, r.legs[0].k, r.legs[0].f);
  line(r.sh, r.arms[0].e, r.arms[0].w);
  // gövde
  line(r.hip, r.neck);
  // atkı kuyruğu (hıza göre arkaya savrulur)
  if (!ghost) {
    const sp = clamp(Math.abs(h.vx) * 1.4 + Math.abs(h.vy) * .6, 0, 1);
    const back = Math.sign(h.vx) === h.dir || Math.abs(h.vx) < .02 ? 1 : -1;
    const base = { x: r.sh.x + 4, y: r.sh.y + 2 };
    const ang = lerp(.1, -(Math.PI / 2 - .25) * back, sp) + (h.vy < -.3 ? .3 : 0);
    const wv = Math.sin(h.scarfT * .02) * (.08 + .25 * sp);
    const a1 = seg(base.x, base.y, ang + wv, 20), a2 = seg(a1.x, a1.y, ang - wv * 1.6, 18);
    ctx.strokeStyle = RED; ctx.lineCap = 'butt'; ctx.lineWidth = 13;
    line(base, a1, a2);
    // boyun bandı
    ctx.lineCap = 'round'; ctx.lineWidth = 11;
    const nb = seg(r.neck.x, r.neck.y, Math.PI - r.p.lean, -6);
    ctx.beginPath(); ctx.moveTo(nb.x - 19, nb.y - 3); ctx.quadraticCurveTo(nb.x, nb.y + 9, nb.x + 19, nb.y - 3); ctx.stroke();
    ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = 5.5;
  }
  // ön bacak + kol
  line(r.hip, r.legs[1].k, r.legs[1].f);
  line(r.sh, r.arms[1].e, r.arms[1].w);
  // kafa
  ctx.save(); ctx.translate(r.head.x, r.head.y); ctx.rotate(r.p.lean + r.p.head);
  circle(0, 0, L.hr); ctx.fillStyle = ghost ? 'rgba(255,255,255,.3)' : '#fff'; ctx.fill(); ctx.stroke();
  if (!ghost) drawFace(h);
  ctx.restore();
  ctx.restore();
}
function drawFace(h) {
  ctx.fillStyle = INK; ctx.strokeStyle = INK; ctx.lineWidth = 3;
  const ex = [-4, 8], ey = -3, blink = h.blink > 0;
  for (let i = 0; i < 2; i++) {
    const x = ex[i];
    if (blink || h.eyes === 'happy') { ctx.beginPath(); ctx.arc(x, ey + 2, 3.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    else if (h.eyes === 'wide') { circle(x, ey, 5); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke(); circle(x + 1, ey, 1.8); ctx.fillStyle = INK; ctx.fill(); }
    else if (h.eyes === 'wink' && i === 1) { ctx.beginPath(); ctx.moveTo(x - 3.5, ey); ctx.lineTo(x + 3.5, ey); ctx.stroke(); }
    else if (h.eyes === 'x') { ctx.beginPath(); ctx.moveTo(x - 3, ey - 3); ctx.lineTo(x + 3, ey + 3); ctx.moveTo(x + 3, ey - 3); ctx.lineTo(x - 3, ey + 3); ctx.stroke(); }
    else if (h.eyes === 'angry') { circle(x, ey + 1, 3); ctx.fill(); ctx.beginPath(); ctx.moveTo(x - 4, ey - 6 + (i ? 2 : -1)); ctx.lineTo(x + 4, ey - 6 + (i ? -1 : 2)); ctx.stroke(); }
    else { circle(x, ey, 3.3); ctx.fill(); }
  }
  ctx.beginPath();
  if (h.mouth === 'o') { ctx.ellipse(3, 9, 3.5, 4.5, 0, 0, Math.PI * 2); ctx.stroke(); }
  else if (h.mouth === 'flat') { ctx.moveTo(-2, 9); ctx.lineTo(8, 9); ctx.stroke(); }
  else if (h.mouth === 'grin') { ctx.moveTo(-5, 5); ctx.quadraticCurveTo(3, 16, 11, 5); ctx.closePath(); ctx.fillStyle = INK; ctx.fill(); }
  else if (h.mouth === 'frown') { ctx.arc(3, 13, 5, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
  else if (h.mouth === 'wavy') { ctx.moveTo(-3, 9); for (let i = 0; i <= 6; i++) ctx.lineTo(-3 + i * 2, 9 + (i % 2 ? -1.5 : 1.5)); ctx.stroke(); }
  else { ctx.arc(3, 4, 6.5, Math.PI * .2, Math.PI * .8); ctx.stroke(); }

  let lastX = z.x + twOf(z) / 2;
  ctx.font = EQF(130); const w9 = ctx.measureText('9').width;
  hero.dir = 1; hero.run = 1;
  let hx = hero.x, total = 0;
  sfx.rise();
  const runDur = 6400;
  speedLines(runDur, null);
  hero.ghost = true;
  await anim(runDur, k => {
    const speed = 1 + 4 * k;
    hero.runSpeed = speed * .7;
    hx += speed * 9; hero.x = hx;
    while (lastX < hero.x + 900) { const t = tok('9', lastX + w9 / 2, 0, { size: 130, trail: false }); digits.push(t); lastX += w9; if (Math.random() < .25) sfx.tick(); }
    S.cam.x = hero.x + 120; S.cam.y = -170; S.cam.z = .9 - k * .3;
  });
  hero.ghost = false;
  // uzakta bir "= 1" var ama ulaşılamıyor → Nod yorulur
  hero.run = 0; hero.runSpeed = 1;
  face('dot', 'wavy'); hero.sweat = 1;
  await pose('tired', 300);
  await wait(900);
  // kamera hızla geri çekilir: dokuzlar uzaktan bir çizgi gibi görünür, sonra 1'e çöker
  const x0 = z.x - 200, x1 = lastX;
  await camTo((x0 + x1) / 2, -170, W / (x1 - x0 + 200) / ZF, 900, E.io);
  await wait(300);
  sfx.magic();
  const cx = (x0 + x1) / 2;
  const ONE = tok('1', cx, 0, { size: 130 * 7, s: 0, color: RED });
  await Promise.all(digits.map((t, i) => tween(t, { x: cx, s: .2 }, 700, E.in)));
  digits.forEach(untok);
  hero.x = cx - 520; hero.sweat = 0;
  ONE.s = 1; ONE.glow = 1;
  impact(cx, -320, { ring: 900, shake: 40, flash: .6, chroma: 20, big: true }); hitStop(170, 90);
  await camTo(cx - 120, -330, .62, 500, E.out);
  tween(ONE, { glow: 0 }, 1500);
  face('wide', 'o'); pose('shock', 150); sym('!', 700); sym('?', 700);
  const lab = tok('0,999… = 1', cx, 180, { size: 90, s: 0, w: 700 }); tween(lab, { s: 1 }, 350, E.back);
  await wait(1700);
  face('dot', 'smile'); await pose('stand', 200);
  return { ONE, lab, cx };
}

async function scenePaper(O) {
  const cx = O.cx;
  fallAway(O.ONE, 0); fallAway(O.lab, 100); sfx.whistle();
  hero.x = cx; hero.y = 0; hero.dir = 1;
  await camTo(cx, -200, .9, 700);
  // kâğıt kayarak gelir
  S.paper = { x: cx + 900, y: 0, w: 300, h: 6, layers: 1, a: 1, flip: 0, fh: 6 };
  hero.x = cx - 250;
  sfx.paper();
  await tween(S.paper, { x: cx }, 500, E.out);
  S.hud = { exp: '0', label: '0,1 mm', a: 0, s: 1, y: VERT ? 230 : H * .42 }; tween(S.hud, { a: 1 }, 300);
  await jumpTo(cx, -6, 450, 110);
  await wait(300);
  // katlama
  const fmt = v => v.toLocaleString('tr-TR', { maximumFractionDigits: v < 10 ? 1 : 0 });
  const unit = mmv => mmv < 10 ? fmt(mmv) + ' mm' : mmv < 1000 ? fmt(mmv / 10) + ' cm' : mmv < 1e6 ? fmt(mmv / 1000) + ' m' : fmt(mmv / 1e6) + ' km';
  let n = 0;
  const p = S.paper;
  // görsel yükseklik: önce gerçek gibi, sonra Nod'un tırmanacağı bir kule
  const visH = n => n <= 6 ? 6 * Math.pow(2, n) * .5 + 3 : 200 + (n - 6) * 220;
  for (n = 1; n <= 42; n++) {
    const fast = n > 6, dur = fast ? Math.max(70, 260 - n * 6) : 420;
    if (!fast) {
      await pose('fold', 120);
      sfx.paper(); p.fh = p.h;
      await tween(p, { flip: 1 }, dur, E.io); p.flip = 0;
      pose('stand', 120);
    } else if (n % 2 === 0) sfx.paper();
    const nh = visH(n);
    p.layers = Math.pow(2, n);
    if (n === 7) { S.noBlur = true; hero.run = 0; face('happy', 'grin'); pose('cheer', 200); sfx.rise(); speedLines(10000, 'v'); }
    // yükseklik artar, Nod üstünde yükselir
    const ph = p.h;
    await anim(fast ? dur : 160, k => { p.h = lerp(ph, nh, k); hero.y = -p.h; S.cam.y = Math.min(-200, -p.h - 120); }, E.out);
    S.hud.exp = String(n); S.hud.label = unit(.1 * Math.pow(2, n)); if (!fast) { S.hud.s = 1.2; tween(S.hud, { s: 1 }, 300, E.back); }
    // gökyüzü: 14. katta mavi, 30'dan sonra uzay
    S.sky = n < 10 ? 0 : n < 30 ? Math.min(1, (n - 10) / 8) : Math.min(2.6, 1 + (n - 30) / 6);
    if (n === 18) burst(cx + 200, hero.y - 100, 0);
    if (n === 36) { S.moon = { x: cx + 40, y: -visH(42) - 520, r: 260 }; }
    if (!fast) await wait(200);
  }
  // Ay'a çarp
  const moonY = S.moon.y + S.moon.r;
  hero.ghost = true;
  const hy = hero.y;
  S.noBlur = false;
  pose('uppercut', 120);
  await anim(350, k => { hero.y = lerp(hy, moonY + 175, k); S.cam.y = hero.y - 160; }, E.in);
  hero.ghost = false;
  impact(hero.x, moonY, { ring: 500, shake: 45, flash: .8, chroma: 24, big: true, colors: ['#fff', '#ffe066', RED] }); hitStop(220, 110);
  face('x', 'o');
  S.moon.rot = 0; tween(S.moon, { rot: .15 }, 400, E.elastic);
  await wait(300);
  // ayın altında sayılar
  S.hud.exp = '42'; S.hud.label = '≈ 439.805 km'; S.hud.y = VERT ? H - 260 : H * .42; S.hud.s = 1.4; tween(S.hud, { s: 1 }, 400, E.back); sfx.ding();
  await wait(1400);
  return { cx, moonY };
}

async function sceneEnd(P) {
  // Nod Ay'dan geri düşer
  sfx.whistle(); hero.ghost = true; pose('flail', 150);
  face('wide', 'o');
  tween(S.hud, { a: 0 }, 300);
  speedLines(2200, 'v');
  const y0 = hero.y, cx = P.cx;
  await anim(2200, k => {
    hero.y = lerp(y0, -1100, E.in(k)); hero.rot = k * Math.PI * 6;
    S.cam.y = hero.y + 40; S.cam.x = cx; S.sky = Math.max(0, 2.6 * (1 - k * 1.15));
    if (S.paper) S.paper.a = 1 - k;
  });
  S.paper = null; S.moon = null; S.sky = 0;
  // aşağıda bekleyen "1"
  const ONE = tok('1', cx, 0, { size: 200, color: INK });
  camTo(cx, -220, .9, 300);
  await anim(320, k => { hero.y = lerp(-1100, tokTop(ONE) + 6, k * k); hero.rot = Math.PI * 6 + k * Math.PI * 2; });
  hero.rot = 0; hero.ghost = false; hero.y = tokTop(ONE) + 6;
  impact(cx, tokTop(ONE), { ring: 420, shake: 36, flash: .35, chroma: 16, big: true }); hitStop(160); squash(ONE);
  face('x', 'wavy'); hero.p = Object.assign({}, POSE.crouch); hero.noBlink = true;
  await wait(800);
  hero.noBlink = false;
  face('dot', 'smile'); await pose('stand', 300);
  await camTo(cx, VERT ? -330 : -230, VERT ? 1.25 : 1.05, 900);
  await wait(300);
  hero.dir = 1; face('wink', 'grin'); hero.noBlink = true;
  await pose('proud', 250);
  ONE.glow = 1; tween(ONE, { glow: 0 }, 1500); sfx.win();
  for (let i = 0; i < 4; i++) wait(i * 330).then(() => firework(cx + rand(-260, 260), rand(-700, -480)));
  await wait(1300);
  await pose('wave', 200);
  for (let i = 0; i < 3; i++) { await tween(hero.p, { aFe: 1.3 }, 180); await tween(hero.p, { aFe: .3 }, 180); }
  await wait(500);
  await tween(S, { end: 1 }, 700);
  await wait(300);
}

async function story() {
  await scene9();
  const NI = await scene142857();
  const P = await scenePyramid(NI);
  const O = await sceneNines(P);
  const Q = await scenePaper(O);
  await sceneEnd(Q);
}

/* ================== Oynatma & video çıktısı ================== */
let runToken = 0;
async function start() {
  initAudio(); runToken++; const my = runToken;
  resetScene(); time = 0; started = true; running = true; paused = false;
  await story(); if (my === runToken) running = false;
}
function togglePause() { if (!started) return; paused = !paused; if (AC) paused ? AC.suspend() : AC.resume(); document.getElementById('btnPause').textContent = paused ? '▶ Devam' : '⏸ Duraklat'; }
document.getElementById('btnPlay').onclick = () => { document.getElementById('btnPlay').textContent = '↺ Baştan'; start(); };
document.getElementById('btnPause').onclick = togglePause;
document.getElementById('btnMusic').onclick = e => { musicOn = !musicOn; e.target.textContent = musicOn ? '🎵 Müzik: Açık' : '🎵 Müzik: Kapalı'; };
cv.addEventListener('click', () => { if (!started) { document.getElementById('btnPlay').textContent = '↺ Baştan'; start(); } else togglePause(); });
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); togglePause(); } });

window.R_init = async () => { await Promise.all([document.fonts.load(EQF(80)), document.fonts.load(EQF(80, 700))]).catch(() => { }); return true; };
window.R_start = () => { started = true; running = true; resetScene(); story().then(() => { window.R_done = true; }); };
window.R_seek = async ms => { while (vclock < ms && !window.R_done) { stepFrame(1000 / 30); await new Promise(r => setTimeout(r)); } draw(); return cv.toDataURL('image/jpeg', .85); };
window.R_step = () => { stepFrame(1000 / 30); draw(); return cv.toDataURL('image/jpeg', .92); };
window.R_audio = async () => {
  const sr = 44100, dur = vclock / 1000 + .5;
  const oc = new OfflineAudioContext(2, Math.ceil(dur * sr), sr); OFF = true; setupAudio(oc);
  for (const e of events) { T0 = e.t; SFX[e.k](...e.a); }
  if (musicOn) { T0 = 0; const spb = 60 / BPM / 2; for (let st = 0, t = .05; t < dur - 1.2; st++, t += spb) musicStep(st, t); }
  const buf = await oc.startRendering();
  const n = buf.length, dv = new DataView(new ArrayBuffer(44 + n * 4));
  const ws = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  ws(0, 'RIFF'); dv.setUint32(4, 36 + n * 4, true); ws(8, 'WAVE'); ws(12, 'fmt '); dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 2, true);
  dv.setUint32(24, sr, true); dv.setUint32(28, sr * 4, true); dv.setUint16(32, 4, true); dv.setUint16(34, 16, true); ws(36, 'data'); dv.setUint32(40, n * 4, true);
  const Lc = buf.getChannelData(0), Rc = buf.getChannelData(1); let o = 44;
  for (let i = 0; i < n; i++) { dv.setInt16(o, clamp(Lc[i], -1, 1) * 32767, true); dv.setInt16(o + 2, clamp(Rc[i], -1, 1) * 32767, true); o += 4; }
  const u8 = new Uint8Array(dv.buffer); let bin = '';
  for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  return btoa(bin);
};

if (VERT) document.querySelector('.stage-wrap').classList.add('vertical');
fxInit(); resetScene();
if (!RENDER) {
  Object.assign(S.cam, { x: 0, y: -170, z: 1 });
  let lastT = performance.now();
  const loop = t => { const real = Math.min(50, t - lastT); lastT = t; if (started && !paused) stepFrame(real); draw(); requestAnimationFrame(loop); };
  requestAnimationFrame(t => { lastT = t; loop(t); });
}
