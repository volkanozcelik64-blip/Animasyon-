<!doctype html>

<style>

<body>

<script>
"use strict";
/* ============================================================

   OfflineAudioContext ile üretilir.

const W = 1080, H = 1920, FPS = 24, DUR = 30, CUT = 29.5, MINT = '#3EE0A8';

const ctx = cv.getContext('2d');
const PI = Math.PI, TAU = 2 * PI;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, p) => a + (b - a) * p;

  lin: p => p, in: p => p * p, out: p => 1 - (1 - p) * (1 - p),

  in3: p => p * p * p, out3: p => 1 - Math.pow(1 - p, 3),

// Anahtar kare izi: [[t, değer, easing], ...]

  return t => {
    if (t <= keys[0][0]) return keys[0][1];
    for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
      const [t0, v0] = keys[i - 1], [t1, v1, e] = keys[i];

}
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

// Sönümlü sallanma: [t0, genlik, açısal hız, sönüm]
function wob(t, ev) { let s = 0; for (const [t0, a, w = 18, d = 5] of ev) if (t > t0) { const k = t - t0; s += a * Math.exp(-k * d) * Math.sin(k * w); } return s; }

function bob(t, t0, t1, amp, n) { return t > t0 && t < t1 ? -Math.abs(Math.sin((t - t0) / (t1 - t0) * PI * n)) * amp : 0; }

/* ---------- Yol: hareket parçaları zinciri ---------- */
class Path {
  constructor(x, y) { this.p0 = [x, y]; this.s = []; }
  to(t0, t1, x, y, ex = 'io', ey = ex) { this.s.push({ k: 'to', t0, t1, x, y, ex, ey }); return this; }
  jump(t0, t1, x, y, h, ex = 'lin') { this.s.push({ k: 'j', t0, t1, x, y, h, ex }); return this; }
  follow(t0, t1, f) { this.s.push({ k: 'f', t0, t1, f }); return this; }
  set(t, x, y) { this.s.push({ k: 'set', t0: t, t1: t, x, y }); return this; }
  tgt(g, t) { if (typeof g.x === 'function') { const v = g.x(t); return g.y === undefined ? v : [v, g.y]; } return [g.x, g.y]; }
  ev(g, t, c) {
    if (g.k === 'set') return [g.x, g.y];
    if (g.k === 'f') return g.f(t);
    const p = g.t1 > g.t0 ? clamp((t - g.t0) / (g.t1 - g.t0), 0, 1) : 1, [tx, ty] = this.tgt(g, t);
    if (g.k === 'to') return [lerp(c[0], tx, E[g.ex](p)), lerp(c[1], ty, E[g.ey](p))];
    return [lerp(c[0], tx, E[g.ex](p)), lerp(c[1], ty, p) - 4 * g.h * p * (1 - p)];
  }
  at(t) {
    let c = this.p0;
    for (const g of this.s) { if (t < g.t0) return c; c = this.ev(g, Math.min(t, g.t1), c); if (t <= g.t1) return c; }
    return c;
  }
}

/* ============================================================

  dive: P({ neck: [0, -152], hL: [-12, -232], hR: [12, -234], fL: [-8, 0], fR: [10, 6], ab: .1, lb: 0 }),

  spin: P({ hip: [0, -84], neck: [0, -156], hL: [-78, -150], hR: [78, -150], fL: [0, 0], fR: [22, -50], ab: .2 }),
  victory: P({ hip: [0, -84], neck: [0, -156], hL: [-46, -226], hR: [46, -226], fL: [-22, 0], fR: [22, 0], ab: .3, hb: -.15 }),

function mixPose(a, b, p) { const o = {}; for (const k in a) { const A = a[k], B = b[k]; o[k] = Array.isArray(A) ? [lerp(A[0], B[0], p), lerp(A[1], B[1], p)] : lerp(A, B, p); } return o; }

  const s = Math.sin(ph), c = Math.cos(ph);
  return P({ hip: [0, -76 - Math.abs(c) * 6], neck: [18, -144], hL: [10 - s * 36, -96], hR: [10 + s * 36, -96],
    fL: [s * 34, -Math.max(0, c) * 30], fR: [-s * 34, -Math.max(0, -c) * 30], hb: .12, ab: .7 });

  return t => {
    let i = 0; while (i + 1 < keys.length && keys[i + 1][0] <= t) i++;
    if (i === 0) return POSES[keys[0][1]];
    const k = keys[i], pr = keys[i - 1];

const NP = new Path(-60, 0)
  .to(1.95, 2.1, -60, -60, 'lin', 'out').to(2.1, 2.3, -60, 0, 'lin', 'in')
  .to(2.45, 2.85, 110, 0, 'io', 'lin')
  .to(3.7, 3.95, 60, 0, 'out', 'lin')
  .jump(4.75, 5.35, 150, 56, 380)
  .to(5.35, 5.45, 150, 30, 'lin', 'out').to(5.45, 5.55, 150, 56, 'lin', 'in')
  .to(6.2, 6.55, 150, 0, 'lin', 'out')
  .to(7.1, 7.45, -180, 0, 'io', 'lin')
  .to(7.95, 8.35, -250, -560, 'lin', 'out')
  .to(8.35, 8.95, 20, -342, 'lin', 'in')
  .jump(9.2, 9.7, 560, -352, 250)
  .jump(11.1, 11.45, 737, 0, 120)
  .jump(12.35, 12.95, 560, -352, 330)
  .jump(13.3, 13.55, 740, 0, 100)
  .to(13.9, 14.1, 560, 0, 'out', 'lin')
  .jump(17.35, 17.7, 1050, -462, 240)

  .to(24.0, 24.5, 4985, -902, 'lin', 'in')
  .follow(24.9, 25.4, t => [4985, -S2c(t) - 2])
  .to(25.4, 25.55, 4985, 0, 'lin', 'in');

  [0, 'stand'], [0.35, 'lookUp', .2], [0.95, 'stand', .05], [1.95, 'stand', .1],
  [2.95, 'poke', .1], [3.15, 'stand', .12], [3.25, 'poke', .08], [3.45, 'stand', .15],
  [3.7, 'startle', .08], [4.0, 'stand', .3],
  [4.75, 'tuck', .08], [5.3, 'lie', .1], [6.2, 'land', .15], [6.55, 'stand', .15],
  [6.75, 'startle', .08], [7.05, 'stand', .1],
  [7.45, 'crouch', .12], [7.7, 'holdUp', .15], [7.88, 'crouch', .06], [7.95, 'holdUp', .1],
  [8.42, 'tuck', .12], [8.95, 'land', .06], [9.1, 'crouch', .08], [9.2, 'tuck', .1], [9.7, 'land', .06], [9.85, 'proud', .2],
  [10.8, 'holdUp', .12], [11.1, 'tuck', .1], [11.45, 'land', .06], [11.55, 'shield', .12],
  [12.35, 'tuck', .08], [12.95, 'land', .06], [13.1, 'stand', .15], [13.2, 'startle', .1],
  [13.3, 'tuck', .08], [13.55, 'land', .06], [13.62, 'pull', .1], [13.9, 'startle', .08], [14.1, 'shield', .15],
  [15.2, 'duck', .06], [15.55, 'stand', .12], [15.62, 'twist', .1], [15.9, 'wind', .12], [16.18, 'throw', .06], [16.6, 'stand', .2],
  [16.95, 'proud', .2], [17.3, 'crouch', .05], [17.35, 'tuck', .1], [17.7, 'land', .05], [17.74, 'tuck', .06],
  [18.12, 'land', .05], [18.17, 'tuck', .06], [18.75, 'land', .05], [18.85, 'stand', .15],
  [19.0, 'startle', .08], [19.05, 'tuck', .08], [19.4, 'land', .06], [19.55, 'startle', .12],
  [20.0, 'hold', .1], [21.68, 'crouch', .06], [21.85, 'dive', .1],
  [24.0, 'tuck', .1], [24.5, 'land', .06], [24.65, 'stand', .15], [24.8, 'startle', .1],
  [25.4, 'tuck', .08], [25.55, 'land', .06], [25.65, 'hold', .12], [26.05, 'chopUp', .1], [26.3, 'chop', .05],
  [26.55, 'stand', .12], [26.62, 'holdUp', .1], [26.95, 'hold', .12], [27.0, 'twist', .1], [27.3, 'poke', .1],
  [27.55, 'stand', .15], [28.0, 'proud', .15], [28.4, 'spin', .12], [29.2, 'victory', .08],

  [12.35, 0], [12.95, -TAU, 'out'], [18.3, -TAU], [18.7, 0, 'io'], [21.85, 0], [22.0, .8, 'out'], [23.99, .8], [24.0, 0]]);
const NSX = K([[0, 1], [0.95, 1], [1.0, 1.6, 'out'], [1.9, 1.6], [2.05, .85, 'out'], [2.25, 1, 'back']]);
const NSY = K([[0, 1], [0.95, 1], [1.0, .25, 'out'], [1.9, .25], [2.05, 1.25, 'out'], [2.25, 1, 'back']]);

  [18.82, 1], [18.9, -1, 'lin'], [19.5, -1], [19.58, 1, 'lin']]);

  [8.95, .4], [9.7, .5], [10.0, .4, 10, 2], [11.45, .4], [12.35, .8], [12.95, .5], [13.2, .6], [13.55, .4], [13.9, .6], [14.4, .3], [14.8, .4],
  [15.55, .9, 16, 2.5], [15.85, .3], [16.2, .5], [17.7, .3], [18.12, .3], [18.75, .4], [19.0, .9], [19.4, .4], [21.7, .4],
  [24.5, .6], [24.8, .5], [25.55, .5], [26.35, .5], [27.25, .4], [29.2, .6]];

  const p = [], s = 38, r = 16;
  for (const [cx, cy, a0] of [[s - r, -(s - r), -PI / 2], [s - r, s - r, 0], [-(s - r), s - r, PI / 2], [-(s - r), -(s - r), PI]])

const SC = .9, PV = 100;
let NC = { t: NaN };

/* ============================================================
   RAKAMLAR ve SEMBOLLER — birim kutuda (yükseklik 1) çizgi yolları

const h = .435, LW = .13;
