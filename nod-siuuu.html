<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nod: SIUUU!</title>
<style>

:root[data-theme="dark"]{--bg:#1a1814;--panel:#26231e;--line:#3a352c;--fg:#eee;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
canvas{display:block;height:min(82vh,calc((100vw - 32px) * 16 / 9));aspect-ratio:9/16;max-width:100%;
  background:#f7efdc;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-weight:600;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<canvas id="c" aria-label="Nod SIUUU cartoon"></canvas>
<div class="controls">
  <button id="play" class="primary">▶ Play</button>
  <button id="mute">🔊 Sound: on</button>
</div>
<script>
"use strict";
/* ============================================================
   Nod: SIUUU! — 30 s, 9:16, 30 fps, hand-drawn notebook cartoon.

  hL: [-66, -110], hR: [66, -110], fL: [-28, 0], fR: [28, 0], abL: -18, abR: 18, lbL: 6, lbR: -6,
  eyeS: 1, iris: 1, look: [0, 0], eyes: 'open', brow: 0, browUp: 0, mouth: 'smile', mo: .5,

    scramble: (t, d) => { for (let x = 0; x < d; x += .055) noise(t + x, .03, { vol: .22, f: 500 + R(x * 50) * 400, q: 2 }); },

    rip: t => { for (let i = 0; i < 9; i++) noise(t + i * .012, .02, { vol: .6, f: 2400 + i * 200, q: 3 }); tone(t, 1900, .06, { vol: .12, to: 3200 }); },
    squeaks: (t, d) => { for (let x = 0; x < d; x += .09) { tone(t + x, 1500 + R(x * 9) * 900, .06, { vol: .07, to: 2600 }); noise(t + x, .05, { vol: .16, f: 2600, q: 3 }); } },

    hold: t => vib(t, 880, .8, { type: 'sine', vol: .03, rate: 7, depth: 6, a: .2 }),

    fwip: t => { noise(t, .15, { vol: .4, f: 1200, to: 3500, q: 2 }); tone(t + .12, 600, .06, { vol: .2, to: 1400 }); },
    nooood: t => {

function scheduleAll(ac, base, from = 0) {

/* ---------- Player ---------- */
const QS = new URLSearchParams(location.search), RENDER = QS.has('render');
let playing = false, t0 = 0, AC = null, outNode = null, muted = false, tNow = 0;
function play() {
  if (!AC) try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  if (outNode) { try { outNode.disconnect(); } catch (e) { } outNode = null; }
  if (AC) { AC.resume(); if (!muted) outNode = scheduleAll(AC, AC.currentTime + .05); }
  t0 = performance.now() + 50; playing = true; document.getElementById('play').textContent = '↺ Replay';
}
document.getElementById('play').onclick = play;
cv.onclick = play;
document.getElementById('mute').onclick = e => { muted = !muted; e.target.textContent = muted ? '🔇 Sound: off' : '🔊 Sound: on'; if (outNode) outNode.gain.value = muted ? 0 : .7; };
if (!RENDER) {
  const loop = () => { if (playing) { tNow = (performance.now() - t0) / 1000; if (tNow >= DUR) playing = false; } draw(Math.max(0, tNow)); requestAnimationFrame(loop); };
  tNow = 0.6; requestAnimationFrame(loop);
}

/* ---------- Render API (tools/render-shorts.js) ---------- */
window.R_fps = FPS; window.R_frames = DUR * FPS;
window.R_frame = i => { draw(i / FPS); return cv.toDataURL('image/jpeg', .92); };
window.R_png = s => { draw(s); return cv.toDataURL('image/png'); };
window.R_audio = async () => {
